<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Правописание наречий — 10 заданий</title>
<style>
:root{
  --paper:#EEF1EF; --sheet:#FFFFFF; --ink:#1B2324; --muted:#5A6668;
  --accent:#1F5E63; --accent-soft:#E2EEEE; --line:#CBD4D3;
  --ok:#2E6B46; --ok-bg:#E2F1E7; --bad:#A8261E; --bad-bg:#F8E3E1; --part:#9A6A12; --part-bg:#FBF0DA;
  --c-purple:#6C2BD9; --c-blue:#1497D1; --c-green:#14B85A; --c-red:#C62A2A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A1B; --sheet:#1D2526; --ink:#E6ECEB; --muted:#9AA8A7;
    --accent:#7CC2C6; --accent-soft:#223436; --line:#37443F;
    --ok:#7CC79A; --ok-bg:#1E3527; --bad:#F08A80; --bad-bg:#3D2220; --part:#E3B45C; --part-bg:#3A2F17;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"PT Serif",Georgia,"Times New Roman",serif;font-size:18px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 60px}
header{padding:10px 0 16px;border-bottom:2px solid var(--accent);margin-bottom:16px}
header h1{margin:0;font-size:clamp(24px,4.5vw,34px);line-height:1.15}
header p{margin:6px 0 0;color:var(--muted);font-size:16px}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.steps button{font:inherit;font-size:17px;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.steps button.cur{border-color:var(--ink);border-width:3px;font-weight:700}
.steps button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.steps button.part{background:var(--part-bg);border-color:var(--part);color:var(--part)}
.steps button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.steps .finish{width:auto;border-radius:22px;padding:0 16px;margin-left:auto;border-color:var(--accent);color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.task{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:22px 22px 18px;display:none}
.task.active{display:block}
.task h2{font-size:21px;margin:0 0 18px;line-height:1.35}
.task h2 .num{color:var(--accent);margin-right:6px}
.hint{color:var(--muted);font-size:15px;margin:-10px 0 16px}
/* statements / pills */
.stack{display:flex;flex-direction:column;gap:12px}
.pill{font:inherit;text-align:center;padding:14px 18px;border:2px solid var(--line);border-radius:18px;background:var(--sheet);color:var(--ink);cursor:pointer}
.pill.on{background:var(--accent-soft);border-color:var(--accent)}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.word{font:inherit;font-size:19px;padding:8px 16px;border:2px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);cursor:pointer;min-width:110px}
.word.struck{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--bad);color:var(--muted)}
.palette{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.swatch{font:inherit;display:flex;align-items:center;gap:10px;background:none;border:2px solid transparent;border-radius:24px;padding:4px 12px 4px 4px;color:var(--ink);cursor:pointer}
.swatch .dot{width:30px;height:30px;border-radius:50%;border:4px solid var(--c)}
.swatch.on{border-color:var(--c)}
.swatch.on .dot{background:var(--c)}
.word.painted{color:#fff;border-color:transparent}
.mark{outline:3px solid var(--ok);outline-offset:2px}
.mark.wrong{outline-color:var(--bad)}
/* match / selects */
.defs{margin:0 0 16px;padding-left:0;list-style:none}
.defs li{margin:6px 0}
.defs b{color:var(--accent)}
.srow{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
select{font:inherit;font-size:17px;padding:6px 10px;border:2px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:110px}
.prefix-row{display:flex;align-items:center;justify-content:center;gap:4px;margin:12px 0;font-size:21px}
.choose-row{margin:10px 0 18px}
.choose-row .lead{font-size:19px;margin-bottom:8px}
.outline-on{border-color:var(--c-red)!important;box-shadow:0 0 0 2px var(--c-red) inset}
.green-on{background:var(--c-green)!important;color:#fff!important;border-color:transparent!important}
/* gaps */
.sent{font-size:19px;margin:14px 0;line-height:2.2}
.sent input,.rebus input{font:inherit;font-size:18px;padding:3px 8px;border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);width:9.5em;border-radius:4px 4px 0 0}
.bank{margin-top:16px;padding:10px 14px;background:var(--accent-soft);border-radius:6px;font-size:17px}
input.ok,select.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
input.bad,select.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.rebus{display:flex;flex-direction:column;gap:26px}
.rb{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pic{position:relative;font-size:84px;line-height:1;display:inline-block;padding:0 14px}
.pic .ap{position:absolute;font-size:46px;font-weight:700;font-family:Georgia,serif}
.pic .ap.r{right:-4px;top:-10px}
.pic .ap.l{left:-6px;bottom:-4px}
.pic .sub{display:block;text-align:center;font-size:20px;font-weight:700;color:var(--c-green);font-family:Georgia,serif;margin-top:4px}
.plus{font-size:64px;font-weight:700;color:var(--c-green);font-family:Georgia,serif}
.rebus input{width:14em;margin-top:6px}
/* bottom */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:16px;padding:8px 16px;border-radius:6px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.main{background:#F5C518;border-color:#F5C518;color:#1B2324;font-weight:700}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.fb{margin-left:auto;font-size:16px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.part{color:var(--part)}
.results{display:none;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:22px}
.results.active{display:block}
.results table{width:100%;border-collapse:collapse;margin:12px 0}
.results td{padding:6px 8px;border-bottom:1px solid var(--line)}
.results td:last-child{text-align:right;font-weight:700}
.big{font-size:30px;font-weight:700;color:var(--accent)}
@media (max-width:520px){.task{padding:16px 14px}.word{min-width:0}.pic{font-size:64px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a href="index.html" style="display:inline-block;margin-bottom:8px;color:var(--accent);font-size:15px;text-decoration:none">← Ко всем заданиям</a>
  <h1>Правописание наречий</h1>
  <p>О и Е после шипящих на конце наречий · О и А на конце наречий · Ь после шипящих на конце наречий</p>
</header>
<div class="steps" id="steps"></div>
<div id="tasks"></div>
<div class="results" id="results"></div>
</div>

<script>
const norm = s => (s||'').toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z-]/g,'').trim();
const C = {purple:'var(--c-purple)',blue:'var(--c-blue)',green:'var(--c-green)',red:'var(--c-red)'};

/* ================= ДАННЫЕ ================= */
const TASKS = [
 {type:'toggle', mode:'fill', title:'Закрасьте фигуры с верными утверждениями.', hint:'Нажми на утверждение, чтобы закрасить его. Верных утверждений может быть несколько.',
  items:[
   {t:'На конце наречий после шипящих под ударением пишется <i>-о</i>, без ударения — <i>-е</i> (исключение: <i>ещё</i>).', a:true},
   {t:'На конце наречий после шипящих под ударением пишется <i>-ё</i>, без ударения — <i>-е</i>.', a:false},
   {t:'В наречиях с приставками <i>из-, до-, с-</i> пишется буква <i>-а</i>, если эти наречия образованы от бесприставочных прилагательных.', a:true},
   {t:'После шипящих во всех наречиях пишется Ь (кроме <i>уж, замуж, невтерпёж</i>).', a:true},
   {t:'После шипящих во всех наречиях пишется Ь.', a:false}]},
 {type:'toggle', mode:'strike', title:'Зачеркните наречия, в которых допущены ошибки.', hint:'Нажми на слово, чтобы зачеркнуть его. Повторное нажатие снимает зачёркивание.',
  items:[['налева',1],['жгуча',1],['заживо',0],['невтерпёжь',1],['замертво',0],['догола',0],['навечна',1],['навзнич',1],['набела',1],['уж',0],['издавна',0],['вызывающе',0],['тягуче',0],['замуж',0],['нанова',1]].map(([t,a])=>({t,a:!!a}))},
 {type:'paint', title:'Определите, к какой части речи относятся слова, в которых после шипящих на конце пишется мягкий знак. Выделите слова таким же цветом.', hint:'Выбери цвет, а затем нажимай на слова.',
  palette:[{id:'n',label:'Существительное 3-го склонения',c:C.purple},{id:'v',label:'Глагол',c:C.blue},{id:'a',label:'Наречие',c:C.green}],
  items:[['прилечь','v'],['точь-в-точь','a'],['прочь','a'],['стричь','v'],['брошь','n'],['дрожь','n'],['сплошь','a'],['мелочь','n'],['вовлечь','v']].map(([t,a])=>({t,a}))},
 {type:'match', title:'Соотнесите наречие с его лексическим значением.',
  defs:['вверх лицом, на спине лёжа','без разбору, насквозь, всюду','распахнув, вовсе открыто','незаметно, украдкою, скрытно','замахнувшись от себя (об ударе)'],
  rows:[['Настежь',3],['Сплошь',2],['Наотмашь',5],['Навзничь',1],['Исподтишка',4]].map(([t,a])=>({t,a}))},
 {type:'paint', title:'Закрасьте фигуры соответствующим цветом.', hint:'Выбери цвет, а затем нажимай на слова.',
  palette:[{id:'e',label:'На конце наречий после шипящих — <i>е</i>',c:C.green},{id:'o',label:'На конце наречий после шипящих — <i>о</i>',c:C.red}],
  items:[['Неуклюж…','e'],['Свеж…','o'],['Потрясающ…','e'],['Блестящ…','e'],['Горяч…','o'],['Общ…','o'],['Понимающ…','e'],['Могуч…','e'],['Жгуч…','e']].map(([t,a])=>({t,a})), wide:true},
 {type:'prefix', title:'В выпадающем списке выберите приставку, от которой зависит правописание букв <i>-о</i> и <i>-а</i> на конце наречий.',
  rows:[{stem:'светло',opts:['До-','За-'],a:'За-'},{stem:'темна',opts:['До-','За-'],a:'До-'},{stem:'чиста',opts:['На-','До-'],a:'До-'},
        {stem:'сухо',opts:['На-','До-'],a:'На-'},{stem:'право',opts:['С-','На-'],a:'На-'},{stem:'ново',opts:['На-','С-'],a:'На-'},{stem:'лева',opts:['На-','С-'],a:'С-'}]},
 {type:'choose', mode:'green', title:'В каждом ряду выделите зелёным цветом слово, от которого образовалось наречие.',
  rows:[{lead:'Изредка —',opts:['редкий','редко','реденький'],a:0},{lead:'Могуче —',opts:['могуч','могучий','могучесть'],a:1},{lead:'Досрочно —',opts:['срок','досрочный','срочно'],a:1}]},
 {type:'choose', mode:'outline', title:'В каждом ряду найдите «третье лишнее». Выделите его красным контуром.',
  rows:[{opts:['Вскачь','Стричь','Испечь'],a:0},{opts:['Запросто','Наскоро','Молодо'],a:2},{opts:['Проще','Кипуче','Угрожающе'],a:0}]},
 {type:'gaps', title:'Запишите подходящие наречия (используйте слова для справок). В наречиях вставьте необходимые буквы.',
  sents:['Для дорогого гостя и ворота {настежь}.','Матушка-рожь кормит всех {сплошь}.','Говорит {направо}, а глядит {налево}.','Один ум {хорошо}, а два {ещё} лучше.','День да ночь — сутки {прочь}.'],
  bank:'проч…, ещ…, направ…, хорош…, налев…, настеж…, сплош…'},
 {type:'rebus', title:'Разгадайте ребусы. Запишите отгаданные слова.', answers:['певуче','искоса']}
];

/* ================= СОСТОЯНИЕ ================= */
const S = TASKS.map(t=>({v:{}, result:null}));
let cur = 0;
const tasksEl = document.getElementById('tasks'), stepsEl = document.getElementById('steps');

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e;}

/* ================= РЕНДЕР ЗАДАНИЙ ================= */
function build(i){
  const t=TASKS[i], st=S[i], box=el('div','task'); box.id='task'+i;
  box.appendChild(el('h2','',`<span class="num">${i+1}.</span>${t.title}`));
  if(t.hint) box.appendChild(el('p','hint',t.hint));
  const body=el('div'); box.appendChild(body);

  if(t.type==='toggle'){
    const wrap=el('div', t.mode==='fill'?'stack':'words');
    t.items.forEach((it,k)=>{
      const b=el('button', t.mode==='fill'?'pill':'word', it.t);
      b.onclick=()=>{st.v[k]=!st.v[k]; b.classList.toggle(t.mode==='fill'?'on':'struck',st.v[k]); clearMarks(i);};
      b.setAttribute('aria-pressed','false'); b.dataset.k=k;
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  }

  if(t.type==='paint'){
    const pal=el('div','palette'); st.brush=t.palette[0].id;
    t.palette.forEach(p=>{
      const b=el('button','swatch'+(p.id===st.brush?' on':''),`<span class="dot"></span><span>${p.label}</span>`);
      b.style.setProperty('--c',p.c);
      b.onclick=()=>{st.brush=p.id; pal.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('on',x===b));};
      pal.appendChild(b);
    });
    body.appendChild(pal);
    const wrap=el('div', t.wide?'stack':'words');
    t.items.forEach((it,k)=>{
      const b=el('button', t.wide?'pill':'word', it.t); b.dataset.k=k;
      b.onclick=()=>{
        st.v[k] = st.v[k]===st.brush ? undefined : st.brush;
        const p=t.palette.find(x=>x.id===st.v[k]);
        b.classList.toggle('painted',!!p); b.style.background=p?p.c:''; clearMarks(i);
      };
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  }

  if(t.type==='match'){
    const ol=el('ul','defs'); t.defs.forEach((d,k)=>ol.appendChild(el('li','',`<b>${k+1}.</b> ${d}`))); body.appendChild(ol);
    body.appendChild(el('p','',`<b>Ответы</b>`));
    t.rows.forEach((r,k)=>{
      const row=el('div','srow'); const s=el('select');
      s.innerHTML='<option value="">—</option>'+t.defs.map((_,n)=>`<option value="${n+1}">${n+1}</option>`).join('');
      s.onchange=()=>{st.v[k]=s.value; s.className='';}; s.dataset.k=k;
      row.appendChild(s); row.appendChild(el('span','',r.t)); body.appendChild(row);
    });
  }

  if(t.type==='prefix'){
    t.rows.forEach((r,k)=>{
      const row=el('div','prefix-row'); const s=el('select');
      s.innerHTML='<option value="">Выбрать</option>'+r.opts.map(o=>`<option>${o}</option>`).join('');
      s.onchange=()=>{st.v[k]=s.value; s.className='';}; s.dataset.k=k;
      row.appendChild(s); row.appendChild(el('span','',r.stem)); body.appendChild(row);
    });
  }

  if(t.type==='choose'){
    t.rows.forEach((r,k)=>{
      const row=el('div','choose-row');
      if(r.lead) row.appendChild(el('div','lead',r.lead));
      const w=el('div','words');
      r.opts.forEach((o,n)=>{
        const b=el('button', t.mode==='outline'?'pill':'word', o); b.dataset.k=k;
        b.onclick=()=>{st.v[k]=st.v[k]===n?undefined:n;
          w.querySelectorAll('button').forEach((x,m)=>x.classList.toggle(t.mode==='outline'?'outline-on':'green-on',st.v[k]===m)); clearMarks(i);};
        w.appendChild(b);
      });
      row.appendChild(w); body.appendChild(row);
    });
  }

  if(t.type==='gaps'){
    let g=0; st.ans=[];
    t.sents.forEach(s=>{
      const p=el('div','sent');
      p.innerHTML=s.replace(/\{(.+?)\}/g,(_,a)=>{st.ans.push(a); return `<input type="text" data-k="${g++}" autocomplete="off" spellcheck="false" aria-label="пропуск">`;});
      body.appendChild(p);
    });
    body.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{st.v[inp.dataset.k]=inp.value; inp.className='';});
    body.appendChild(el('div','bank',`<b>Слова для справок:</b> ${t.bank}`));
  }

  if(t.type==='rebus'){
    const scythe=`<svg width="120" height="130" viewBox="0 0 120 130" aria-label="коса"><path d="M28 8 C60 0 92 6 112 22 L106 26 C86 14 58 10 30 14 Z" fill="#8A9096"/><line x1="108" y1="22" x2="40" y2="126" stroke="#9C7A45" stroke-width="6" stroke-linecap="round"/></svg>`;
    const rb=el('div','rebus');
    rb.innerHTML=`
     <div><div class="rb"><span class="pic">🐓<span class="ap r">’</span><span class="sub">Т=В</span></span><span class="plus">+ че</span></div>
       <input type="text" data-k="0" autocomplete="off" spellcheck="false" aria-label="ответ к первому ребусу"></div>
     <div><div class="rb"><span class="pic"><span class="ap l">,</span>🦊<span class="ap r">’</span></span>${scythe}</div>
       <input type="text" data-k="1" autocomplete="off" spellcheck="false" aria-label="ответ ко второму ребусу"></div>`;
    rb.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{st.v[inp.dataset.k]=inp.value; inp.className='';});
    body.appendChild(rb);
  }

  const bar=el('div','bar');
  const chk=el('button','btn main','Проверить'), rst=el('button','btn quiet','Сбросить'), nxt=el('button','btn',i<9?'Следующее задание':'Итоги'), fb=el('span','fb');
  chk.onclick=()=>check(i); rst.onclick=()=>reset(i); nxt.onclick=()=>i<9?go(i+1):showResults();
  bar.append(chk,rst,nxt,fb); box.appendChild(bar); box._fb=fb;
  return box;
}

function clearMarks(i){ document.querySelectorAll(`#task${i} .mark`).forEach(x=>x.classList.remove('mark','wrong')); }

/* ================= ПРОВЕРКА ================= */
function check(i){
  const t=TASKS[i], st=S[i], box=document.getElementById('task'+i);
  let right=0, total=0;
  const markBtn=(b,ok)=>{b.classList.add('mark'); b.classList.toggle('wrong',!ok);};
  clearMarks(i);

  if(t.type==='toggle'){
    box.querySelectorAll('[data-k]').forEach(b=>{const k=+b.dataset.k, sel=!!st.v[k], ok=sel===t.items[k].a;
      total++; if(ok)right++; if(sel||!ok) markBtn(b,ok);});
  }
  if(t.type==='paint'){
    box.querySelectorAll('.stack [data-k], .words [data-k]').forEach(b=>{const k=+b.dataset.k, ok=st.v[k]===t.items[k].a;
      total++; if(ok)right++; markBtn(b,ok);});
  }
  if(t.type==='match'||t.type==='prefix'){
    box.querySelectorAll('select').forEach(s=>{const k=+s.dataset.k, a=t.rows[k].a, ok=String(s.value)===String(a);
      total++; if(ok)right++; s.className=ok?'ok':'bad';});
  }
  if(t.type==='choose'){
    t.rows.forEach((r,k)=>{total++; const ok=st.v[k]===r.a; if(ok)right++;
      const btns=[...box.querySelectorAll(`[data-k="${k}"]`)];
      if(st.v[k]!==undefined) markBtn(btns[st.v[k]],ok); else btns.forEach(b=>markBtn(b,false));});
  }
  if(t.type==='gaps'||t.type==='rebus'){
    const ans = t.type==='gaps'?st.ans:t.answers;
    box.querySelectorAll('input').forEach(inp=>{const k=+inp.dataset.k, ok=norm(inp.value)===norm(ans[k]);
      total++; if(ok)right++; inp.className=ok?'ok':'bad';});
  }
  st.result={right,total};
  const fb=box._fb;
  fb.className='fb '+(right===total?'ok':right>0?'part':'bad');
  fb.textContent = right===total ? `Всё верно! ${right} из ${total}` : `Верно ${right} из ${total}. Исправь ошибки и проверь ещё раз.`;
  renderSteps();
}

function reset(i){
  S[i]={v:{},result:null};
  const old=document.getElementById('task'+i), n=build(i); n.classList.toggle('active',old.classList.contains('active'));
  old.replaceWith(n); renderSteps();
}

/* ================= НАВИГАЦИЯ ================= */
function renderSteps(){
  stepsEl.innerHTML='';
  TASKS.forEach((_,i)=>{
    const r=S[i].result, b=el('button','',i+1);
    if(i===cur && !document.getElementById('results').classList.contains('active')) b.classList.add('cur');
    if(r) b.classList.add(r.right===r.total?'ok':r.right>0?'part':'bad');
    b.setAttribute('aria-label','Задание '+(i+1)); b.onclick=()=>go(i); stepsEl.appendChild(b);
  });
  const f=el('button','finish','Завершить'); f.onclick=showResults; stepsEl.appendChild(f);
}
function go(i){
  cur=i; document.getElementById('results').classList.remove('active');
  document.querySelectorAll('.task').forEach((t,k)=>t.classList.toggle('active',k===i));
  renderSteps(); window.scrollTo({top:0,behavior:'smooth'});
}
function showResults(){
  const res=document.getElementById('results');
  TASKS.forEach((_,i)=>{ if(!S[i].result) check(i); });
  document.querySelectorAll('.task').forEach(t=>t.classList.remove('active'));
  let sum=0; const rows=TASKS.map((t,i)=>{const r=S[i].result; sum+=r.right/r.total;
    return `<tr><td>${i+1}. ${t.title.replace(/<[^>]+>/g,'').slice(0,70)}${t.title.length>70?'…':''}</td><td>${r.right} / ${r.total}</td></tr>`;}).join('');
  const pct=Math.round(sum*10);
  res.innerHTML=`<h2 style="margin-top:0">Итоги</h2><div class="big">${pct}%</div>
    <p style="color:var(--muted);margin:4px 0 0">Каждое задание весит одинаково. Нажми на номер задания вверху, чтобы вернуться и исправить ошибки.</p>
    <table>${rows}</table>`;
  res.classList.add('active'); renderSteps(); window.scrollTo({top:0,behavior:'smooth'});
}

TASKS.forEach((_,i)=>tasksEl.appendChild(build(i)));
go(0);

/* ================= УЧЁТ РЕЗУЛЬТАТОВ (Google Таблица) ================= */
(function(){
const API='https://script.google.com/macros/s/AKfycbwzFjFEKrQWwLOX6fUnfqDWY81fkiL4EuTGuLf8c_ifyPLBDdJ8XapnTCb1k5w1Z9Hi/exec';
const TRAINER=document.title.split(' — ')[0];
const KEY_USER='trainer_user', KEY_QUEUE='trainer_queue';
let user=null, started=Date.now(), dirty=false, lastSend=null;

const ls={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
          del(k){try{localStorage.removeItem(k);}catch(e){}}};

const css=document.createElement('style');
css.textContent=`
.gate{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:26px 24px;max-width:400px;width:100%}
.gate-card h2{margin:0 0 6px;font-size:22px}
.gate-card p{margin:0 0 14px;color:var(--muted);font-size:16px}
.gate-card input{font:inherit;font-size:28px;letter-spacing:.3em;text-align:center;width:100%;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.gate-card .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.gate-msg{min-height:1.4em;margin-top:10px;font-size:15px}
.gate-msg.bad{color:var(--bad)}
.who{margin-top:8px;font-size:16px;color:var(--muted)}
.who b{color:var(--ink)}
.who button{font:inherit;font-size:14px;background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0 4px}
.save{margin-top:14px;padding:10px 14px;border-radius:6px;font-size:16px}
.save.ok{background:var(--ok-bg);color:var(--ok)} .save.bad{background:var(--bad-bg);color:var(--bad)} .save.wait{background:var(--accent-soft);color:var(--muted)}
`;
document.head.appendChild(css);

async function api(payload){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  return r.json();
}

/* ---------- вход по коду ---------- */
function showGate(){
  const g=document.createElement('div'); g.className='gate';
  g.innerHTML=`<div class="gate-card" role="dialog" aria-labelledby="gt">
    <h2 id="gt">Вход в проверочную работу</h2><p>Введи свой личный код из шести цифр.</p>
    <input id="gcode" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Личный код">
    <div class="row"><button class="btn main" id="gbtn">Войти</button></div>
    <div class="gate-msg" id="gmsg"></div></div>`;
  document.body.appendChild(g);
  const inp=g.querySelector('#gcode'), msg=g.querySelector('#gmsg'), btn=g.querySelector('#gbtn');
  inp.focus();
  inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,6); msg.textContent=''; msg.className='gate-msg';};
  inp.onkeydown=e=>{if(e.key==='Enter')btn.click();};
  btn.onclick=async()=>{
    const code=inp.value.trim();
    if(code.length!==6){msg.textContent='В коде должно быть 6 цифр.'; msg.className='gate-msg bad'; return;}
    btn.disabled=true; msg.textContent='Проверяю…'; msg.className='gate-msg';
    try{
      const res=await api({action:'login',code});
      if(res.ok){ user={code,name:res.name}; ls.set(KEY_USER,user); g.remove(); started=Date.now(); showWho(); flushQueue(); }
      else { msg.textContent='Такого кода нет. Проверь цифры или спроси учителя.'; msg.className='gate-msg bad'; }
    }catch(e){
      msg.innerHTML='Нет связи с журналом. Можно выполнять задания, но результат не сохранится. <button class="btn quiet" id="goff" style="margin-top:8px">Продолжить без входа</button>';
      msg.className='gate-msg bad';
      g.querySelector('#goff').onclick=()=>{g.remove(); showWho();};
    }
    btn.disabled=false;
  };
}
function showWho(){
  let w=document.querySelector('header .who');
  if(!w){w=document.createElement('div'); w.className='who'; document.querySelector('header').appendChild(w);}
  w.innerHTML=user?`Ученик: <b></b> <button type="button">Не ты? Выйти</button>`:`Вход не выполнен — результат не сохранится. <button type="button">Войти</button>`;
  if(user) w.querySelector('b').textContent=user.name;
  w.querySelector('button').onclick=()=>{user=null; ls.del(KEY_USER); showGate(); showWho();};
}

/* ---------- сбор результатов ---------- */
function describe(i){
  const box=document.getElementById('task'+i), out=[];
  box.querySelectorAll('.mark.wrong, input.bad, select.bad, tr.bad, .card.bad').forEach(el=>{
    if(el.tagName==='TR'){ out.push(`слово ${+el.dataset.r+1}: «${[...el.querySelectorAll('input')].map(x=>x.value).join('').toLowerCase()}»`); return; }
    if(el.tagName==='INPUT'){ out.push(`«${el.value.trim()||'—'}»`); return; }
    if(el.tagName==='SELECT'){ const ctx=(el.closest('.srow,.prefix-row,.rule')||el.parentNode).textContent.replace(/\s+/g,' ').replace(/Выбрать|—/g,'').trim().slice(0,50); out.push(`${ctx}: ${el.value||'не выбрано'}`); return; }
    const txt=el.textContent.replace(/\s+/g,' ').trim().slice(0,60);
    if(el.classList.contains('opt')) out.push(`${txt} (${el.classList.contains('on')?'отмечено зря':'пропущено'})`);
    else out.push(txt);
  });
  return out;
}
function collect(){
  let sum=0; const by=[], ans=[];
  TASKS.forEach((_,i)=>{const r=S[i].result; sum+=r.right/r.total; by.push(`${i+1}: ${r.right}/${r.total}`);
    const errs=describe(i); if(errs.length) ans.push(`Зад. ${i+1} — ${errs.join('; ')}`);});
  return {percent:Math.round(sum/TASKS.length*100), byTask:by.join('  '), answers:ans.length?ans.join(' | '):'без ошибок',
          minutes:(Date.now()-started)/60000};
}

async function send(payload){
  try{ const res=await api(payload); if(res.ok) return res; throw new Error(res.error||'fail'); }
  catch(e){ const q=ls.get(KEY_QUEUE)||[]; if(!q.some(x=>x.id===payload.id)){q.push(payload); ls.set(KEY_QUEUE,q);} return null; }
}
async function flushQueue(){
  const q=ls.get(KEY_QUEUE)||[]; if(!q.length) return;
  const left=[];
  for(const p of q){ try{ const r=await api(p); if(!r.ok && r.error!=='unknown_code') left.push(p); }catch(e){ left.push(p); } }
  if(left.length) ls.set(KEY_QUEUE,left); else ls.del(KEY_QUEUE);
}

/* ---------- встраиваемся в тренажёр ---------- */
const origCheck=check;
check=function(i){ origCheck(i); dirty=true; };

const origShow=showResults;
showResults=async function(){
  origShow();
  const res=document.getElementById('results');
  const st=document.createElement('div'); st.className='save'; res.appendChild(st);
  const again=document.createElement('button'); again.className='btn'; again.style.marginTop='12px'; again.textContent='Новая попытка';
  again.onclick=()=>{ TASKS.forEach((_,i)=>reset(i)); started=Date.now(); dirty=false; lastSend=null; go(0); };
  res.appendChild(again);

  if(!user){ st.className='save bad'; st.textContent='Вход не выполнен — результат не сохранён.'; return; }
  if(!dirty && lastSend){ st.className='save ok'; st.textContent=lastSend; return; }
  dirty=false;
  const data=collect();
  st.className='save wait'; st.textContent='Сохраняю результат…';
  const payload={action:'result', id:Date.now()+'-'+Math.random().toString(36).slice(2), code:user.code, trainer:TRAINER, ...data};
  const r=await send(payload);
  if(r){ lastSend=`Результат сохранён: попытка № ${r.attempt}, ${data.percent}%.`; st.className='save ok'; st.textContent=lastSend; }
  else { lastSend=null; st.className='save bad'; st.textContent='Нет связи с журналом. Результат сохранён на этом устройстве и отправится автоматически, когда появится интернет.'; }
};

user=ls.get(KEY_USER);
if(user) showWho(); else showGate();
renderSteps();
flushQueue();
window.addEventListener('online',flushQueue);
})();
</script>
</body>
</html>
