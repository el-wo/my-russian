<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Русский язык: тренировки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8; --surface: #fffdf8; --border: #ddd6c4; --text: #2a2118;
      --muted: #7a6e5f; --hint: #b0a48c; --green: #3a7d44; --green-bg: #eaf4ec;
      --red: #c0392b; --accent: #5b4fcf; --accent-bg: #efedfa;
      --shadow: 0 4px 24px rgba(60,40,10,0.10);
      --serif: 'Merriweather', Georgia, 'Times New Roman', serif;
      --sans: 'Nunito', 'Segoe UI', Arial, sans-serif;
    }
    body { background: var(--bg); font-family: var(--sans); color: var(--text); min-height: 100vh; padding: 2.5rem 1rem 4rem; }
    .wrap { max-width: 860px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2.2rem; }
    header h1 { font-family: var(--serif); font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { font-size: 0.95rem; color: var(--muted); margin-top: 0.5rem; }

    .pos-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 2.4rem; }
    .pos-btn {
      font-family: var(--serif); font-size: 1rem; font-weight: 700;
      padding: 10px 20px; border-radius: 99px; border: 2px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .pos-btn .n { font-family: var(--sans); font-size: 0.72rem; font-weight: 700; color: var(--hint); }
    .pos-btn:hover { border-color: var(--accent); color: var(--accent); }
    .pos-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pos-btn.active .n { color: #d9d5f7; }
    .pos-btn.empty { color: var(--muted); }
    .pos-btn:focus-visible, .set:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; }
    .section-head h2 { font-family: var(--serif); font-size: 1.4rem; }
    .section-head span { font-size: 0.85rem; color: var(--muted); }

    .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .set {
      display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.3rem 1.3rem 1.1rem; box-shadow: var(--shadow);
      transition: border-color 0.15s, transform 0.15s;
    }
    .set:not(.soon):hover { border-color: var(--accent); }
    .set h3 { font-family: var(--serif); font-size: 1.05rem; line-height: 1.4; }
    .set p { font-size: 0.87rem; color: var(--muted); line-height: 1.6; flex: 1; }
    .set .ex { font-family: var(--serif); font-style: italic; font-size: 0.85rem; color: var(--hint); }
    .set .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 0.8rem; font-weight: 700; }
    .tag-ready { color: var(--green); background: var(--green-bg); border-radius: 99px; padding: 3px 12px; }
    .tag-soon { color: var(--hint); border: 1px dashed var(--border); border-radius: 99px; padding: 2px 12px; }
    .set .go { color: var(--accent); }
    .set .links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .lnk { text-decoration: none; padding: 5px 12px; border-radius: 99px; border: 2px solid var(--border); color: var(--text); }
    .lnk:hover { border-color: var(--accent); color: var(--accent); }
    .lnk.go { border-color: var(--accent); color: var(--accent); }
    .lnk.go:hover { background: var(--accent-bg); }
    .set .foot { gap: 8px; flex-wrap: wrap; }
    .set.soon { box-shadow: none; background: transparent; border-style: dashed; }
    .set.soon h3 { color: var(--muted); }

    .pos-btn.test { border-style: dashed; border-color: var(--accent); color: var(--accent); }
    .pos-btn.test.active { border-style: solid; color: #fff; }
    .tag-test { color: var(--accent); background: var(--accent-bg); border-radius: 99px; padding: 3px 12px; }
    .note { background: var(--accent-bg); color: var(--text); border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 1.2rem; font-size: 0.92rem; line-height: 1.6; }
    .empty-msg { text-align: center; color: var(--muted); padding: 2.5rem 1rem; border: 1px dashed var(--border); border-radius: 16px; line-height: 1.7; }
    @media (max-width: 480px) { header h1 { font-size: 1.4rem; } .pos-btn { font-size: 0.9rem; padding: 8px 14px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    .sec-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 620px; margin: 0 auto 1.6rem; }
    .sec-btn { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: border-color .15s, background .15s; }
    .sec-btn small { font-family: var(--sans); font-size: 0.78rem; font-weight: 600; color: var(--muted); }
    .sec-btn:hover { border-color: var(--accent); }
    .sec-btn.active { background: var(--text); border-color: var(--text); color: var(--surface); }
    .sec-btn.active small { color: var(--border); }
    .sec-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 480px) { .sec-switch { grid-template-columns: 1fr; } }
    .view-switch { display: flex; justify-content: center; margin-bottom: 1.8rem; }
    .view-switch div { display: inline-flex; background: var(--surface); border: 2px solid var(--border); border-radius: 99px; padding: 4px; gap: 4px; }
    .view-btn { font-family: var(--sans); font-size: 0.9rem; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 99px; cursor: pointer; }
    .view-btn.active { background: var(--text); color: var(--surface); }
    .view-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .intro { text-align: center; color: var(--muted); font-size: 0.92rem; line-height: 1.7; max-width: 560px; margin: -0.6rem auto 1.8rem; }

    .ortho { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 1.4rem 1.5rem 1.3rem; margin-bottom: 16px; }
    .ortho-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
    .ortho h3 { font-family: var(--serif); font-size: 1.15rem; line-height: 1.4; }
    .ortho > p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; margin: 6px 0 4px; }
    .ortho .ex { font-family: var(--serif); font-style: italic; font-size: 0.86rem; color: var(--hint); margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font-family: var(--sans); font-size: 0.8rem; font-weight: 700; border-radius: 99px; padding: 5px 12px; text-decoration: none; border: 1.5px solid var(--border); color: var(--muted); background: transparent; }
    .chip.ready { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    a.chip.ready:hover { background: var(--green); color: #fff; }
    .chip small { font-weight: 600; opacity: 0.75; }
    .mix-btn { font-family: var(--sans); font-size: 0.85rem; font-weight: 700; padding: 9px 18px; border-radius: 99px; text-decoration: none; white-space: nowrap; }
    a.mix-btn { border: 2px solid var(--accent); color: var(--accent); }
    a.mix-btn:hover { background: var(--accent-bg); }
    span.mix-btn { border: 2px dashed var(--border); color: var(--hint); }
    .ortho-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    a.mix-btn.algo-btn { border-color: var(--text); color: var(--text); }
    a.mix-btn.algo-btn:hover { background: var(--bg); }
    .chips-label { font-size: 0.78rem; color: var(--hint); font-weight: 600; margin-bottom: 6px; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Русский язык: тренировки</h1>
    <p>Орфография и пунктуация</p>
  </header>

  <div class="sec-switch" role="tablist">
    <button class="sec-btn" id="sb-orfo" onclick="setSection('orfo')">Орфография<small>по частям речи</small></button>
    <button class="sec-btn" id="sb-punct" onclick="setSection('punct')">Пунктуация<small>в простом и сложном предложении</small></button>
  </div>

  <div class="view-switch" id="viewSwitch"><div role="tablist">
    <button class="view-btn" id="vb-parts" onclick="setView('parts')">По частям речи</button>
    <button class="view-btn" id="vb-ortho" onclick="setView('ortho')">Орфограмма во всех частях речи</button>
  </div></div>

  <nav class="pos-grid" id="pos"></nav>
  <main id="content"></main>
</div>

<script>
/*
  КАК ДОБАВИТЬ НОВЫЙ СЕТ:
  1. Положите HTML-файл тренировки в ту же папку, что и эта страница.
  2. Найдите нужную часть речи ниже и добавьте (или отредактируйте) объект в её списке sets:
     { title: "...", desc: "...", ex: "...", file: "имя_файла.html" }
  3. Если file не указан — карточка показывается как «В разработке».
  4. Схема-алгоритм к теме подключается полем algo: "имя_файла.html" — появится кнопка «Алгоритм».
  5. Проверочные задания добавляются в раздел с id: "tests" (в самом конце списка PARTS).
*/
const PARTS = [
  { id: "sush",  name: "Существительное", sets: [] },
  { id: "pril",  name: "Прилагательное",  sets: [] },
  { id: "chisl", name: "Числительное",    sets: [] },
  { id: "mest",  name: "Местоимение",     sets: [] },
  { id: "glag",  name: "Глагол",          sets: [] },
  { id: "prich", name: "Причастие",       sets: [] },
  { id: "deepr", name: "Деепричастие",    sets: [] },
  { id: "narech", name: "Наречие", sets: [
    { title: "Слитно или раздельно: слова для запоминания", ortho: "slit",
      desc: "Исключения, фразеологизмы и наречные сочетания, написание которых нужно запомнить.",
      ex: "на боковую, доверху, ни при чём, впопыхах",
      file: "flashcards_narechiya.html" },
    { title: "Наречия через дефис", ortho: "slit",
      desc: "Приставка по- + -ому/-ему/-ски, во-/в- с порядковыми, кое-, -то, -либо, -нибудь, повторы.",
      ex: "по-новому, в-третьих, кое-где, еле-еле" },
    { title: "Н и НН в наречиях", ortho: "nn",
      desc: "Сколько Н в наречии на -о, столько же, сколько в прилагательном или причастии.",
      ex: "туманно, ветрено, взволнованно",
      file: "flashcards_nn_narechiya.html",
      algo: "n_nn_narechiya_schema.html" },
    { title: "О и А на конце наречий",
      desc: "Приставки из-, до-, с- → -а; в-, на-, за- → -о.",
      ex: "досуха, издалека, вправо, заново" },
    { title: "О и Е после шипящих на конце", ortho: "oyo",
      desc: "Под ударением -о, без ударения -е. Исключение: ещё.",
      ex: "горячо, певуче, свежо" },
    { title: "Ь после шипящих на конце", ortho: "soft",
      desc: "После шипящих на конце наречий пишется Ь, кроме уж, замуж, невтерпёж.",
      ex: "сплошь, настежь, вскачь" },
    { title: "НЕ с наречиями", ortho: "ne",
      desc: "Слитно и раздельно: синонимы без НЕ, противопоставление с А, «далеко не», «вовсе не», сравнительная степень.",
      ex: "недалеко — не далеко, а близко; ничуть не быстро",
      file: "flashcards_ne_narechiya.html",
      algo: "ne_narechiya_algoritm.html" },
    { title: "НЕ и НИ в отрицательных наречиях", ortho: "neni",
      desc: "Под ударением НЕ, без ударения НИ.",
      ex: "негде — нигде, некогда — никогда" }
  ]},
  { id: "sluzh", name: "Служебные части речи", sets: [] },
  { id: "tests", name: "Проверочные задания", kind: "test",
    note: "Для входа в проверочное задание нужен личный код из шести цифр — его выдаёт учитель. Результат сохраняется после нажатия «Завершить».",
    sets: [
    { title: "Правописание наречий",
      desc: "О и Е после шипящих на конце наречий, О и А на конце наречий, Ь после шипящих. 10 заданий.",
      ex: "певуче, засветло, навзничь",
      file: "test_narechiya_pravopisanie.html" },
    { title: "НЕ с разными частями речи",
      desc: "Слитное и раздельное написание НЕ, НЕ и НИ, морфемный состав, кроссворд. 10 заданий.",
      ex: "негодующе, не о чем, недоросль",
      file: "test_ne_chasti_rechi.html" },
    { title: "Дефисное написание наречий",
      desc: "По- с -ому/-ему/-ски, в-/во- с порядковыми, кое-, -то, -либо, -нибудь, повторы. 10 заданий.",
      ex: "по-моему, в-шестых, мало-помалу",
      file: "test_narechiya_defis.html" },
    { title: "НЕ с наречиями",
      desc: "Слитно и раздельно, НЕ — приставка или часть корня, синонимы без НЕ, поиск ошибок, фразеологизмы. 10 заданий.",
      ex: "небрежно, далеко не удачно, не по-честному",
      file: "test_ne_narechiya.html" }
  ]}
];

/*
  ОБОБЩАЮЩИЕ ОРФОГРАММЫ
  - parts: части речи, где встречается орфограмма (id из списка PARTS выше);
  - file: смешанная тренировка по всем частям речи (если не указан — «В разработке»);
  - algo: общая схема-алгоритм по орфограмме (появится кнопка «Алгоритм»), algoTitle — её подпись;
  - чтобы сет части речи появился здесь, добавьте ему поле ortho с id орфограммы.
*/
const ORTHO = [
  { id: "ne", title: "НЕ с разными частями речи",
    desc: "Слитно и раздельно: слова без НЕ не употребляются, синонимы, противопоставление, краткие и полные причастия, деепричастия и глаголы.",
    ex: "ненастье, неглубокий, не пришёл, нехотя, не решённая мною задача",
    parts: ["sush","pril","narech","glag","prich","deepr","mest"] },
  { id: "nn", title: "Н и НН в разных частях речи",
    desc: "Суффиксы прилагательных, полные и краткие причастия, отглагольные прилагательные, наречия и существительные.",
    ex: "серебряный, жареный — жаренный на масле, туманно, гостиная",
    algo: "n_nn_pril_prich_schema.html", algoTitle: "Алгоритм: прилагательные и причастия",
    parts: ["pril","prich","narech","sush"] },
  { id: "oyo", title: "О — Ё (Е) после шипящих и Ц",
    desc: "В корнях, суффиксах и окончаниях существительных, прилагательных, наречий; в глаголах и отглагольных формах.",
    ex: "шёпот, крючок, свежо, ожёг — ожог, парчовый",
    parts: ["sush","pril","narech","glag","prich"] },
  { id: "soft", title: "Ь после шипящих",
    desc: "Существительные 3-го склонения, глаголы (-шь, -ешься, повелительное наклонение), наречия, частицы.",
    ex: "ночь — мяч, пишешь, режь, настежь, уж, лишь",
    parts: ["sush","glag","narech","sluzh"] },
  { id: "slit", title: "Слитно, раздельно, через дефис",
    desc: "Сложные существительные и прилагательные, пол-, наречия, неопределённые местоимения, производные предлоги, союзы и частицы.",
    ex: "пол-лимона, светло-зелёный, по-новому, кое-кто, в течение, тоже — то же",
    parts: ["sush","pril","narech","mest","sluzh"] },
  { id: "neni", title: "НЕ и НИ",
    desc: "Отрицательные местоимения и наречия, частицы в устойчивых сочетаниях и придаточных.",
    ex: "некого — никого, негде — нигде, кто бы ни пришёл, не кто иной, как",
    parts: ["mest","narech","sluzh"] },
  { id: "suff", title: "Гласные в суффиксах",
    desc: "-ек/-ик, -ец/-иц у существительных, -ев/-ив у прилагательных, -ова/-ева и -ыва/-ива у глаголов, суффиксы причастий.",
    ex: "замочек — ключик, боевой — красивый, беседовать — рассказывать, клеящий",
    parts: ["sush","pril","glag","prich"] },
  { id: "end", title: "Безударные окончания",
    desc: "Падежные окончания существительных и прилагательных, личные окончания глаголов и суффиксы причастий.",
    ex: "в здании — на станции, о синем море, колют — колющий",
    parts: ["sush","pril","glag","prich"] }
];

/*
  ПУНКТУАЦИЯ
  Сеты добавляются так же, как в орфографии: поле file — тренажёр, algo — схема-алгоритм.
*/
const PUNCT = [
  { id: "prost", name: "Простое предложение", sets: [
    { title: "Тире между подлежащим и сказуемым",
      desc: "Существительное + существительное, числительное, инфинитив, «это», «вот»; когда тире не ставится.",
      ex: "Москва — столица России. Учиться — всегда пригодится." },
    { title: "Однородные члены предложения",
      desc: "Запятая при бессоюзной связи, с повторяющимися, противительными и двойными союзами; однородные и неоднородные определения.",
      ex: "и смеялись, и плакали; не только…, но и…" },
    { title: "Обобщающие слова при однородных членах",
      desc: "Двоеточие перед однородными членами, тире после них, двоеточие и тире внутри предложения.",
      ex: "Везде: в лесу, в поле — пахло весной." },
    { title: "Обособленные определения и приложения",
      desc: "Причастный оборот до и после определяемого слова, при местоимении, с обстоятельственным значением; приложения.",
      ex: "Река, покрытая льдом, … Он, усталый, …" },
    { title: "Обособленные обстоятельства",
      desc: "Деепричастные обороты и одиночные деепричастия, фразеологизмы, обороты с предлогами «несмотря на», «благодаря».",
      ex: "Прочитав письмо, он … работать спустя рукава" },
    { title: "Уточняющие члены предложения",
      desc: "Уточнение места и времени, пояснительные слова «то есть», «а именно», присоединительные конструкции.",
      ex: "Внизу, под горой, … , то есть …" },
    { title: "Вводные слова и обращения",
      desc: "Вводные слова и предложения, вставные конструкции; слова, которые не являются вводными; обращения.",
      ex: "К счастью, … Однако он — Он однако пришёл" },
    { title: "Сравнительные обороты",
      desc: "Когда обособляются обороты с «как», «словно», «будто», а когда нет: фразеологизмы, часть сказуемого, «в качестве».",
      ex: "Глаза, как звёзды, … белый как снег" }
  ]},
  { id: "slozh", name: "Сложное предложение", sets: [
    { title: "Сложносочинённое предложение",
      desc: "Запятая перед союзами и, а, но, или; когда запятая не нужна: общий второстепенный член, общее придаточное.",
      ex: "Светало, и туман рассеялся. Утром туман рассеялся и выглянуло солнце.",
      file: "zapyatye_ssp.html",
      algo: "zapyataya_ssp_schema.html" },
    { title: "Сложноподчинённое предложение",
      desc: "Выделение придаточного запятыми; союзные слова; придаточное внутри главного.",
      ex: "Дом, где я родился, … Я знаю, что он придёт." },
    { title: "СПП с несколькими придаточными",
      desc: "Однородное, последовательное и параллельное подчинение; запятая между однородными придаточными с союзом «и».",
      ex: "Я знаю, что он придёт и что всё будет хорошо." },
    { title: "Запятая на стыке союзов",
      desc: "Когда ставится запятая между двумя союзами, а когда нет (если дальше идёт «то», «так», «но»).",
      ex: "Он сказал, что, если пойдёт дождь, … — что если …, то …" },
    { title: "Бессоюзное сложное предложение",
      desc: "Запятая, точка с запятой, двоеточие и тире: перечисление, причина, пояснение, противопоставление, следствие.",
      ex: "Я знаю: он придёт. Лес рубят — щепки летят." },
    { title: "Сложные предложения с разными видами связи",
      desc: "Сочинение, подчинение и бессоюзная связь в одном предложении.",
      ex: "Когда стемнело, мы вернулись, и дома нас ждал ужин." }
  ]}
];

let section = lsGet("ru-section") || "orfo";
let pgroup = lsGet("punct-group") || "prost";
let view = lsGet("orfo-view") || "parts";
let current = localStorageGet() || "narech";

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function localStorageGet() {
  try { return localStorage.getItem("orfo-pos"); } catch (e) { return null; }
}
function localStorageSet(v) { try { localStorage.setItem("orfo-pos", v); } catch (e) {} }

function readyCount(p) { return p.sets.filter(s => s.file).length; }

function renderNav() {
  document.getElementById("pos").innerHTML = PARTS.map(p => {
    const n = readyCount(p);
    const cls = ["pos-btn", p.id === current ? "active" : "", n ? "" : "empty", p.kind === "test" ? "test" : ""].join(" ");
    return `<button class="${cls}" onclick="select('${p.id}')" aria-pressed="${p.id === current}">
      ${p.name}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  }).join("");
}

function renderContent() {
  renderGroup(PARTS.find(x => x.id === current) || PARTS[0]);
}

function renderGroup(p) {
  const ready = readyCount(p);
  const isTest = p.kind === "test";
  let body;
  if (!p.sets.length) {
    body = `<div class="empty-msg">Тренировок по теме «${p.name}» пока нет.<br>Они появятся здесь, когда будут добавлены.</div>`;
  } else {
    body = `<div class="sets">` + p.sets.map(s => (s.file || s.algo)
      ? `<div class="set">
           <h3>${s.title}</h3><p>${s.desc}</p><div class="ex">${s.ex}</div>
           <div class="foot">
             ${isTest ? '<span class="tag-test">Проверочное</span>' : s.file ? '<span class="tag-ready">Готово</span>' : '<span class="tag-soon">Тренажёр в разработке</span>'}
             <span class="links">
               ${s.algo ? `<a class="lnk algo" href="${s.algo}">Алгоритм</a>` : ""}
               ${s.file ? `<a class="lnk go" href="${s.file}">${isTest ? "Начать" : "Тренажёр"} →</a>` : ""}
             </span>
           </div>
         </div>`
      : `<div class="set soon">
           <h3>${s.title}</h3><p>${s.desc}</p><div class="ex">${s.ex}</div>
           <div class="foot"><span class="tag-soon">В разработке</span></div>
         </div>`
    ).join("") + `</div>`;
  }
  document.getElementById("content").innerHTML = `
    <div class="section-head"><h2>${p.name}</h2>
      <span>${!p.sets.length ? "" : isTest ? `Заданий: ${ready}` : `Готово тренировок: ${ready} из ${p.sets.length}`}</span></div>
    ${p.note ? `<div class="note">${p.note}</div>` : ""}
    ${body}`;
}

function setSection(sct) { section = sct; lsSet("ru-section", sct); renderAll(); }
function selectPunct(id) { pgroup = id; lsSet("punct-group", id); renderAll(); }

function renderPunct() {
  document.getElementById("pos").innerHTML = PUNCT.map(g => {
    const n = readyCount(g);
    const cls = ["pos-btn", g.id === pgroup ? "active" : "", n ? "" : "empty"].join(" ");
    return `<button class="${cls}" onclick="selectPunct('${g.id}')" aria-pressed="${g.id === pgroup}">
      ${g.name}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  }).join("");
  renderGroup(PUNCT.find(g => g.id === pgroup) || PUNCT[0]);
}

function select(id) { section = "orfo"; lsSet("ru-section", "orfo"); current = id; localStorageSet(id); view = "parts"; lsSet("orfo-view", view); renderAll(); }

function setView(v) { view = v; lsSet("orfo-view", v); renderAll(); }

function renderOrtho() {
  const partName = id => (PARTS.find(p => p.id === id) || {}).name || id;
  const html = ORTHO.map(o => {
    const chips = o.parts.map(pid => {
      const part = PARTS.find(p => p.id === pid);
      const set = part && part.sets.find(s => s.ortho === o.id && s.file);
      return set
        ? `<a class="chip ready" href="${set.file}" title="${set.title}">${partName(pid)}</a>`
        : `<button class="chip" onclick="select('${pid}')" title="Открыть раздел «${partName(pid)}»">${partName(pid)}</button>`;
    }).join("");
    const readyN = o.parts.filter(pid => {
      const part = PARTS.find(p => p.id === pid);
      return part && part.sets.some(s => s.ortho === o.id && s.file);
    }).length;
    const mix = o.file
      ? `<a class="mix-btn" href="${o.file}">Смешанная тренировка →</a>`
      : `<span class="mix-btn">Смешанная — в разработке</span>`;
    const algo = o.algo ? `<a class="mix-btn algo-btn" href="${o.algo}">${o.algoTitle || "Алгоритм"}</a>` : "";
    return `<section class="ortho">
      <div class="ortho-top"><h3>${o.title}</h3><div class="ortho-btns">${algo}${mix}</div></div>
      <p>${o.desc}</p>
      <div class="ex">${o.ex}</div>
      <div class="chips-label">Готово по частям речи: ${readyN} из ${o.parts.length}</div>
      <div class="chips">${chips}</div>
    </section>`;
  }).join("");
  document.getElementById("content").innerHTML = html;
}

function renderAll() {
  document.getElementById("sb-orfo").classList.toggle("active", section === "orfo");
  document.getElementById("sb-punct").classList.toggle("active", section === "punct");
  const vs = document.getElementById("viewSwitch");
  if (section === "punct") {
    vs.style.display = "none";
    document.getElementById("pos").style.display = "";
    renderPunct();
    return;
  }
  vs.style.display = "";
  document.getElementById("vb-parts").classList.toggle("active", view === "parts");
  document.getElementById("vb-ortho").classList.toggle("active", view === "ortho");
  const nav = document.getElementById("pos");
  if (view === "parts") { nav.style.display = ""; renderNav(); renderContent(); }
  else {
    nav.style.display = "none";
    renderOrtho();
    document.getElementById("content").insertAdjacentHTML("afterbegin",
      `<p class="intro">Одна орфограмма — во всех частях речи. Зелёная часть речи открывает готовую тренировку, серая — раздел этой части речи. Смешанная тренировка собирает все случаи вместе.</p>`);
  }
}

renderAll();
</script>
</body>
</html>
