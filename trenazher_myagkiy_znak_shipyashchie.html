<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тренажёр: Ь после шипящих на конце слова</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8; --surface: #fffdf8; --border: #ddd6c4; --text: #2a2118;
      --muted: #7a6e5f; --hint: #b0a48c; --green: #3a7d44; --green-bg: #eaf4ec;
      --red: #c0392b; --red-bg: #fdf0ee; --accent: #5b4fcf; --accent-bg: #efedfa;
      --shadow: 0 4px 24px rgba(60,40,10,0.10);
      --serif: 'Merriweather', Georgia, 'Times New Roman', serif;
      --sans: 'Nunito', 'Segoe UI', Arial, sans-serif;
    }
    body {
      background: var(--bg); font-family: var(--sans); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem 4rem;
    }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 1.5rem; }
    .progress-bar { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.4s ease; width: 0%; }
    .card-wrap { width: 100%; max-width: 560px; }
    .card, .finish-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 2.5rem 2rem 2rem; text-align: center; box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: center;
    }
    .top-msg { font-size: 1.1rem; font-weight: 700; min-height: 30px; margin-bottom: 0.6rem; opacity: 0; transition: opacity 0.3s; letter-spacing: 0.5px; }
    .top-msg.show { opacity: 1; }
    .top-msg.good { color: var(--green); }
    .top-msg.remind { color: var(--muted); }
    .mode-badge {
      display: inline-block; font-size: 0.75rem; font-weight: 600; color: var(--red);
      background: var(--red-bg); border: 1px solid #f0c4be; border-radius: 99px;
      padding: 3px 14px; margin-bottom: 0.8rem;
    }
    .counter { font-size: 0.78rem; color: var(--hint); margin-bottom: 1.2rem; font-weight: 600; letter-spacing: 1px; }
    .word-display {
      font-family: var(--serif); font-size: 1.6rem; font-weight: 400; margin-bottom: 1.8rem;
      line-height: 1.5; word-break: break-word;
    }
    .q { font-weight: 700; color: var(--red); }
    .q.correct { color: var(--green); }
    .q.reveal { color: var(--red); }
    .choices { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 1.6rem; }
    .choice-btn {
      font-family: var(--serif); font-size: 1.2rem; font-weight: 700;
      min-width: 150px; padding: 14px 20px; border-radius: 14px;
      border: 2px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .choice-btn small { font-family: var(--sans); font-size: 0.72rem; font-weight: 600; color: var(--hint); }
    .choice-btn:hover:not(:disabled) { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); box-shadow: 0 2px 12px rgba(91,79,207,0.13); }
    .choice-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .choice-btn:active:not(:disabled) { transform: scale(0.96); }
    .choice-btn.wrong-flash { background: var(--red-bg); border-color: var(--red); color: var(--red); animation: shake 0.35s; }
    .choice-btn.right { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    .explanation { font-size: 0.92rem; color: var(--muted); line-height: 1.8; max-width: 440px; opacity: 0; transition: opacity 0.4s; min-height: 60px; }
    .explanation.show { opacity: 1; }
    .explanation b { color: var(--text); font-weight: 700; }
    .explanation i { color: var(--hint); }
    .nav-row { display: flex; justify-content: center; margin-top: 1.4rem; }
    .nav-btn, .btn-restart, .btn-errors, .btn-start {
      padding: 11px 26px; border-radius: 99px; border: 2px solid var(--border); background: var(--surface);
      color: var(--text); font-family: var(--sans); font-size: 0.9rem; font-weight: 700; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn:hover, .btn-restart:hover, .btn-start:hover { background: var(--bg); border-color: var(--muted); }
    .btn-start.primary { border-color: var(--accent); color: var(--accent); }
    .btn-start.primary:hover { background: var(--accent-bg); }
    .btn-errors { border-color: var(--red); color: var(--red); background: transparent; }
    .btn-errors:hover { background: var(--red-bg); }
    .finish-icon { font-size: 2.8rem; margin-bottom: 0.6rem; }
    .finish-title { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; color: var(--green); margin-bottom: 0.4rem; }
    .finish-sub { font-size: 0.95rem; color: var(--muted); margin-bottom: 1.6rem; line-height: 1.6; }
    .mistakes-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: 0.8rem; }
    .mistake-item { font-family: var(--serif); font-size: 1.02rem; color: var(--text); margin: 7px 0; }
    .mistake-item span { color: var(--red); font-weight: 700; }
    .all-correct { font-size: 0.95rem; color: var(--green); font-weight: 700; margin-bottom: 0.6rem; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 1.8rem; }
    .kbd-hint { font-size: 0.75rem; color: var(--hint); margin-top: 1rem; }
    @media (max-width: 480px) {
      header h1 { font-size: 1.2rem; }
      .word-display { font-size: 1.3rem; }
      .choice-btn { min-width: 0; width: 100%; font-size: 1.1rem; }
      .card, .finish-card { padding: 2rem 1.2rem 1.5rem; }
      .kbd-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    .home-link { position: absolute; top: 1rem; left: 1rem; font-size: 0.85rem; font-weight: 700; color: var(--muted); text-decoration: none; padding: 6px 14px; border: 2px solid var(--border); border-radius: 99px; background: var(--surface); }
    .home-link:hover { color: var(--accent); border-color: var(--accent); }
    body { position: relative; }
    @media (max-width: 480px) { .home-link { position: static; align-self: flex-start; margin-bottom: 1rem; } }
  
    .sentence { font-family: var(--serif); font-size: 1.5rem; line-height: 1.7; margin: 0.4rem 0 1.4rem; }
    .gap { display: inline-block; min-width: 1.15em; padding: 0 2px; margin: 0 1px; font: inherit; font-weight: 700; color: var(--accent);
      background: var(--accent-bg); border: 0; border-bottom: 3px solid var(--accent); border-radius: 6px 6px 0 0; cursor: pointer; line-height: 1.25; }
    .gap:hover:not(:disabled) { background: #e2defa; }
    .gap:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .gap.empty { color: var(--hint); }
    .gap:disabled { cursor: default; }
    .gap.ok { color: var(--green); background: var(--green-bg); border-bottom-color: var(--green); }
    .gap.bad { color: var(--red); background: var(--red-bg); border-bottom-color: var(--red); }
    .word { font-weight: 700; }
    .nav-btn.primary { border-color: var(--accent); color: var(--accent); }
    .nav-btn.primary:hover { background: var(--accent-bg); }
    .kbd-hint { text-align: center; }
    .task-hint { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.6rem; }
    .okno-mini { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 0.4rem 0 1rem; font-size: 0.9rem; }
    .okno-mini span { background: var(--bg); border-radius: 10px; padding: 6px 10px; }
    .okno-mini b { color: var(--text); }
</style>
</head>

      <div class="btn-row" style="margin-top:0.4rem">
        <button class="btn-start primary" onclick="begin(20)">20 случайных</button>
        <button class="btn-start" onclick="begin(0)">Все ${SOURCE.length}</button>
      </div>
    </div>`;
}

function begin(n) {
  const all = shuffle(SOURCE);
  deck = n ? all.slice(0, n) : all;
  roundSet = [...deck];
  idx = 0; mistakes = []; isErrorMode = false;
  render();
}

function sentenceHTML(w, state) {
  const shown = val ? SHOW(val) : "?";
  const cls = "gap" + (val ? "" : " empty") + (state ? " " + state : "");
  return w.ctx.replace("#", `<span class="word">${w.pre}<button class="${cls}" id="gap" onclick="tap()" aria-label="Пропуск: ${val === '0' ? 'без мягкого знака' : val || 'не выбран'}">${shown}</button>${w.post}</span>`);
}

function render() {
  if (idx >= deck.length) { showFinish(); return; }
  const w = deck[idx];
  val = ""; checked = false;
  document.getElementById("prog").style.width = (idx / deck.length * 100) + "%";
  const badge = isErrorMode ? '<div class="mode-badge">Работа над ошибками</div>' : "";
  document.getElementById("main").innerHTML = `
    <div class="card">
      <div class="top-msg" id="topmsg"></div>
      ${badge}
      <div class="counter">${idx + 1} / ${deck.length}</div>
      <div class="task-hint">Нажми на пропуск: ь — пишем мягкий знак, ∅ — не пишем</div>
      <div class="sentence" id="sent">${sentenceHTML(w)}</div>
      <div class="explanation" id="expl">${w.expl}</div>
    </div>
    <div class="nav-row"><button class="nav-btn primary" id="actBtn" onclick="act()">Проверить</button></div>
    <div class="kbd-hint">Клавиши: Ь (M) — мягкий знак, 0 — без него, Enter — проверить / дальше</div>`;
}

function setVal(v) {
  if (checked) return;
  val = v;
  document.getElementById("sent").innerHTML = sentenceHTML(deck[idx]);
  document.getElementById("gap").focus();
}
function tap() { if (!checked) setVal(CYCLE[(CYCLE.indexOf(val) + 1) % CYCLE.length]); }

function act() { checked ? next() : check(); }

function check() {
  const w = deck[idx];
  const top = document.getElementById("topmsg");
  if (!val) { top.textContent = "Сначала выбери букву"; top.className = "top-msg remind show"; return; }
  checked = true;
  const ok = val === w.end;
  if (!ok) { val = w.end; if (!mistakes.includes(w)) mistakes.push(w); }
  document.getElementById("sent").innerHTML = sentenceHTML(w, ok ? "ok" : "bad");
  document.getElementById("gap").disabled = true;
  top.textContent = ok ? "МОЛОДЕЦ!" : "Запомни!";
  top.className = "top-msg " + (ok ? "good" : "remind") + " show";
  document.getElementById("expl").classList.add("show");
  const b = document.getElementById("actBtn"); b.textContent = "Следующее →"; b.focus();
}

function next() { idx++; render(); }

document.addEventListener("keydown", e => {
  if (!document.getElementById("actBtn")) return;
  const k = e.key.toLowerCase();
  if (!checked && (k === "ь" || k === "m")) setVal("ь");
  else if (!checked && (k === "0" || k === "x" || k === "ч")) setVal("0");
  else if (e.key === "Enter") { e.preventDefault(); act(); }
});

function showFinish() {
  document.getElementById("prog").style.width = "100%";
  const total = deck.length, correct = total - mistakes.length;
  const list = mistakes.length
    ? `<div class="mistakes-title">Слова с ошибками</div>` + mistakes.map(w => `<div class="mistake-item">${w.pre}<span>${w.end === "0" ? "" : w.end}</span>${w.post}</div>`).join("")
    : `<div class="all-correct">Всё верно! 🎉</div>`;
  const errBtn = mistakes.length ? `<button class="btn-errors" onclick="startErrorMode()">Работа над ошибками</button>` : "";
  document.getElementById("main").innerHTML = `
    <div class="finish-card">
      <div class="finish-icon">${mistakes.length ? "📝" : "🏆"}</div>
      <div class="finish-title">${isErrorMode ? "Работа над ошибками завершена!" : "Тренировка завершена!"}</div>
      <div class="finish-sub">Верно с первого раза: ${correct} из ${total}</div>
      ${list}
      <div class="btn-row">
        <button class="btn-restart" onclick="repeatRound()">Повторить эти же слова</button>
        <button class="btn-restart" onclick="startScreen()">Начать заново</button>
        ${errBtn}
        <a class="btn-restart" href="index.html" style="text-decoration:none">На главную</a>
      </div>
    </div>`;
}
function repeatRound() { deck = shuffle(roundSet); idx = 0; mistakes = []; render(); }
function startErrorMode() { const errs = [...mistakes]; mistakes = []; deck = shuffle(errs); roundSet = [...deck]; idx = 0; isErrorMode = true; render(); }

startScreen();
</script>
</body>
</html>
