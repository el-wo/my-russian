<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Словарные слова: карточки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f0e8; --surface: #fffdf8; --border: #ddd6c4; --text: #2a2118;
    --muted: #7a6e5f; --hint: #b0a48c; --green: #3a7d44; --green-bg: #eaf4ec;
    --red: #c0392b; --red-bg: #fdf0ee; --accent: #5b4fcf; --accent-bg: #efedfa;
    --orange: #e0662a;
    --shadow: 0 4px 24px rgba(60,40,10,0.10);
    --serif: 'Merriweather', Georgia, 'Times New Roman', serif;
    --sans: 'Nunito', 'Segoe UI', Arial, sans-serif;
  }
  body { background: var(--bg); font-family: var(--sans); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 1.2rem 16px 4rem; }
  .home { align-self: flex-start; max-width: 640px; width: 100%; margin: 0 auto 0.8rem; }
  .home a { display: inline-block; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--border);
    color: var(--muted); font-weight: 700; font-size: 0.85rem; text-decoration: none; background: var(--surface); }
  .home a:hover { border-color: var(--text); color: var(--text); }
  header { text-align: center; margin-bottom: 1.4rem; }
  header h1 { font-family: var(--serif); font-size: 1.5rem; letter-spacing: -0.5px; }
  header p { font-size: 0.88rem; color: var(--muted); margin-top: 0.35rem; }
  .wrap { width: 100%; max-width: 640px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.8rem 1.6rem; box-shadow: var(--shadow); }
  .hidden { display: none !important; }

  /* ---- старт ---- */
  .lbl { font-size: 0.78rem; font-weight: 800; color: var(--hint); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 0.6rem; }
  .grades { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .chip { padding: 7px 16px; border-radius: 999px; border: 2px solid var(--border); background: var(--bg);
    font: 700 0.95rem var(--sans); color: var(--text); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip:disabled { opacity: .45; cursor: default; }
  .modes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .mode { text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--border); background: var(--bg);
    cursor: pointer; font-family: var(--sans); color: var(--text); }
  .mode b { display: block; font-size: 1.02rem; }
  .mode small { color: var(--muted); font-size: 0.8rem; }
  .mode:hover { border-color: var(--accent); background: var(--accent-bg); }
  .mode:focus-visible, .chip:focus-visible, .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- выбор слов ---- */
  .pick-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 0.9rem; }
  .pick-top input { flex: 1 1 180px; min-width: 0; padding: 9px 14px; border-radius: 999px; border: 2px solid var(--border);
    font: 600 0.95rem var(--sans); background: var(--bg); color: var(--text); }
  .link { background: none; border: 0; color: var(--accent); font: 700 0.85rem var(--sans); cursor: pointer; padding: 4px 6px; }
  .wlist { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px 10px; max-height: 52vh; overflow: auto;
    padding: 4px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .wlist label { display: flex; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
  .wlist label:hover { background: var(--accent-bg); }
  .wlist input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
  .pick-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 1rem; flex-wrap: wrap; }

  .btn { padding: 11px 24px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface);
    font: 800 0.92rem var(--sans); color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--text); }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.main:hover { background: #4a3fb8; }
  .btn:disabled { opacity: .4; cursor: default; }

  /* ---- карточка ---- */
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .bar { flex: 1; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .4s; }
  .cnt { font-size: 0.8rem; font-weight: 800; color: var(--hint); white-space: nowrap; }
  .stop { font-size: 0.8rem; }
  .card { text-align: center; padding: 1.6rem 1.2rem 1.6rem; min-height: 380px; display: flex; flex-direction: column; align-items: center; }
  .badge { font-size: 0.75rem; font-weight: 700; color: var(--red); background: var(--red-bg); border: 1px solid #f0c4be; border-radius: 99px; padding: 3px 14px; margin-bottom: .6rem; }
  .msg { min-height: 1.7rem; font-size: 1.15rem; font-weight: 800; margin-bottom: .4rem; }
  .msg.good { color: var(--green); }
  .msg.bad { color: var(--red); }
  .word-row { display: flex; align-items: flex-start; justify-content: center; gap: 14px; margin: 0.8rem 0 0.4rem; position: relative; }
  .word { font-family: var(--serif); font-size: 2.1rem; letter-spacing: 0.06em; line-height: 1.2; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .seg { white-space: pre; }
  .gap { display: inline-flex; flex-direction: column; align-items: center; min-width: 0.9em; }
  .gap .slot { color: var(--text); white-space: pre; }
  .seg.ok { color: var(--green); font-weight: 700; }
  .seg.fixed { color: var(--red); font-weight: 700; }
  .gap .slot.dots { color: var(--text); letter-spacing: 0.02em; }
  .gap.cur .slot.dots { color: var(--orange); }
  .gap .slot.ok { color: var(--green); font-weight: 700; }
  .gap .slot.fixed { color: var(--red); font-weight: 700; }
  .gap .slot.sp { display: inline-block; min-width: 0.55em; }
  .gap .vars { font-family: var(--sans); font-size: 0.8rem; font-weight: 800; color: var(--hint); letter-spacing: 0.15em; margin-top: 2px; white-space: nowrap; }
  .help { flex: none; width: 34px; height: 34px; margin-top: 6px; border-radius: 50%; border: 2.5px solid var(--hint); background: none; color: var(--hint); font: 800 1.05rem var(--sans); cursor: pointer; }
  .help:hover, .help[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .tip { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 8px; z-index: 5; width: min(420px, 90vw);
    background: var(--accent); color: #fff; padding: 14px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; text-align: left; box-shadow: 0 8px 30px rgba(91,79,207,.3); }
  .sep-line { width: 100%; height: 1px; background: var(--border); margin: 1.4rem 0 1.4rem; }
  .opts { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .opt { min-width: 76px; height: 76px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--border); background: #fff;
    font: 700 1.7rem var(--serif); color: var(--muted); cursor: pointer; transition: border-color .15s, color .15s, transform .1s; }
  .opt.txt { font: 800 1rem var(--sans); min-width: 120px; height: 62px; }
  .opt:hover { border-color: var(--orange); color: var(--orange); }
  .opt:active { transform: scale(.96); }
  .opt.wrong { border-color: var(--red); color: var(--red); background: var(--red-bg); animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .meaning { font-size: 1.02rem; line-height: 1.6; color: #4a4f63; max-width: 520px; }
  .meaning i { font-style: normal; color: var(--muted); }
  .next-row { margin-top: 1.4rem; }
  .keys { margin-top: 1rem; font-size: .75rem; color: var(--hint); }

  /* ---- итог ---- */
  .fin { text-align: center; }
  .fin h2 { font-family: var(--serif); font-size: 1.4rem; margin-bottom: .6rem; }
  .score { font-size: 2.6rem; font-weight: 800; color: var(--green); }
  .fin p { color: var(--muted); margin: .3rem 0 1rem; }
  .errs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0.6rem 0 1.4rem; }
  .errs span { background: var(--red-bg); border: 1px solid #f0c4be; color: var(--red); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: .92rem; }
  .fin-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  @media (max-width: 560px) {
    .panel { padding: 1.3rem 1rem; }
    .modes { grid-template-columns: 1fr; }
    .wlist { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .word { font-size: 1.55rem; letter-spacing: 0.03em; }
    .opt { min-width: 64px; height: 64px; font-size: 1.45rem; }
    .opt.txt { min-width: 96px; height: 54px; font-size: .9rem; padding: 0 10px; }
    .card { min-height: 340px; padding: 1.2rem .4rem; }
  }
</style>
</head>
<body>
<div class="home"><a href="index.html">← Главная</a></div>
<header>
  <h1>Словарные слова</h1>
  <p>Выбери букву или способ написания для каждого пропуска</p>
</header>

<div class="wrap">

  <!-- старт -->
  <section class="panel" id="scrStart">
    <p class="lbl">Класс</p>
    <div class="grades" id="grades"></div>
    <p class="lbl">Сколько слов</p>
    <div class="modes">
      <button class="mode" data-mode="all"><b>Все слова</b><small id="allCount"></small></button>
      <button class="mode" data-mode="10"><b>Случайные 10</b><small>короткая разминка</small></button>
      <button class="mode" data-mode="20"><b>Случайные 20</b><small>обычная тренировка</small></button>
      <button class="mode" data-mode="pick"><b>Выбрать слова</b><small>отметь нужные в списке</small></button>
    </div>
  </section>

  <!-- выбор слов -->
  <section class="panel hidden" id="scrPick">
    <div class="pick-top">
      <input type="search" id="q" placeholder="Найти слово…" aria-label="Поиск слова">
      <button class="link" id="pAll">Отметить все</button>
      <button class="link" id="pNone">Снять все</button>
    </div>
    <div class="wlist" id="wlist"></div>
    <div class="pick-bottom">
      <button class="btn" id="pBack">← Назад</button>
      <button class="btn main" id="pGo">Начать</button>
    </div>
  </section>

  <!-- карточка -->
  <section class="hidden" id="scrCard">
    <div class="bar-row">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <span class="cnt" id="cnt"></span>
      <button class="link stop" id="stop">Завершить</button>
    </div>
    <div class="panel card">
      <span class="badge hidden" id="badge">Повторяем ошибку</span>
      <p class="msg" id="msg" aria-live="polite"></p>
      <div class="word-row">
        <div class="word" id="word"></div>
        <button class="help" id="help" aria-expanded="false" aria-label="Подсказка">?</button>
        <div class="tip hidden" id="tip"></div>
      </div>
      <div class="sep-line"></div>
      <div class="opts" id="opts"></div>
      <p class="meaning hidden" id="meaning"></p>
      <div class="next-row hidden" id="nextRow"><button class="btn main" id="next">Дальше →</button></div>
      <p class="keys">Клавиши: 1, 2, 3 — варианты, Enter — дальше</p>
    </div>
  </section>

  <!-- итог -->
  <section class="panel fin hidden" id="scrFin">
    <h2>Тренировка окончена</h2>
    <div class="score" id="score"></div>
    <p id="finText"></p>
    <div class="errs" id="errs"></div>
    <div class="fin-btns">
      <button class="btn main" id="fErr">Повторить ошибки</button>
      <button class="btn" id="fAgain">Ещё раз</button>
      <button class="btn" id="fMenu">К выбору слов</button>
    </div>
  </section>
</div>

<script>
/*
  КАК ДОБАВИТЬ КЛАСС: допишите в WORDS ключ с номером класса и список слов.
  Каждое слово: [запись с пропусками, значение и пример, подсказка].
  Пропуск — в квадратных скобках, варианты через «|», верный отмечен «!».
  Для слитного/раздельного написания: _ — раздельно, + — слитно, - — через дефис.
  Пример: "по[!_|+|-]окончани[!и|е]"
*/
const WORDS = {
6: [
 ["г[!е|и]ктар", "Мера площади: 100 × 100 метров. <i>Поле занимает три гектара.</i>", "Гекто- — «сто»: гектолитр, гектар."],
 ["пр[и|!е]з[е|!и]рать", "Относиться с крайним неуважением. <i>Он презирает трусость.</i>", "Пре- = «пере-»: ставить ни во что. Не путать с «призирать» — давать приют."],
 ["с[!е|и][лд|!льд][и|!е]рей", "Овощное растение с пахучими листьями. <i>В суп добавили сельдерей.</i>", "Запомни: сеЛЬДЕрей — с мягким знаком."],
 ["тр[!и|е]буна", "Возвышение для оратора. <i>Докладчик поднялся на трибуну.</i>", "Трибун — оратор Древнего Рима."],
 ["к[!о|а][!рр|р][!е|и]сп[!о|а]ндент", "Журналист, который присылает сообщения с места событий. <i>Корреспондент вёл репортаж с площади.</i>", "Две Р и О: коРРеспОндент."],
 ["две[сь|!с]т[е|!и]", "Число 200. <i>В зале двести мест.</i>", "Двести — без мягкого знака, на конце И."],
 ["экз[ы|!е]мпляр", "Отдельный предмет из ряда одинаковых. <i>Купи два экземпляра книги.</i>", "Экз- в начале, как в «экзамен»; -пляр."],
 ["к[!а|о]рни[с|!з]", "Выступ стены; планка для штор. <i>На карнизе сидели голуби.</i>", "Проверка: карни́зы."],
 ["[а|!о]рнам[!е|и]нт", "Узор из повторяющихся элементов. <i>Ваза украшена орнаментом.</i>", "Как «орнаментальный»: О и Е."],
 ["т[!и|е]п[а|!о]графия", "Предприятие, где печатают книги. <i>Газету напечатали в типографии.</i>", "Тип + -о- + графия (пишу)."],
 ["шту[!к|кк][о|!а]турить", "Покрывать стену раствором. <i>Рабочие штукатурят стены.</i>", "Штукатур, штукатурка — с А."],
 ["ф[е|!и]з[е|!и][а|!о]номия", "Лицо (разг.). <i>У него довольная физиономия.</i>", "Запомни: фИзИОномия."],
 ["пр[!и|е]мер", "Случай, поясняющий правило. <i>Приведи пример.</i>", "При- — «приближение»: «примерить» правило на случай."],
 ["и[!с|сс]ку[сс|!с]ный", "Умелый, мастерский. <i>Искусный мастер сделал шкатулку.</i>", "От «искусство», но в прилагательном одна С перед Н."],
 ["трист[!а|о]", "Число 300. <i>До города триста километров.</i>", "Двести, триста, четыреста — на конце И / А, без мягкого знака."],
 ["б[!а|о]хр[!о|а]ма", "Кайма из свисающих нитей. <i>Скатерть с бахромой.</i>", "Словарное слово: бАхрОма."],
 ["б[!и|е][!о|а]графия", "Описание жизни человека. <i>Мы прочитали биографию писателя.</i>", "Био — «жизнь», графия — «пишу»."],
 ["[!а|о][лл|!л]юминий", "Лёгкий серебристый металл. <i>Кастрюля сделана из алюминия.</i>", "Одна Л: алюминий."],
 ["заглав[!и|е]е", "Название книги или статьи. <i>Прочитай заглавие рассказа.</i>", "Глава — заглавие."],
 ["р[а|!о]ве[ст|!с]ник", "Человек того же возраста. <i>Мы с ним ровесники.</i>", "От «ровня», «ровный»; без Т."],
 ["[и|!э]мбле[мм|!м]а", "Условное изображение-символ. <i>На флаге — эмблема клуба.</i>", "Э в начале, одна М."],
 ["к[а|!о]м[о|!а]ндир", "Начальник воинского подразделения. <i>Командир отдал приказ.</i>", "Команда — командир."],
 ["[э|!и]сп[а|!о][!л|лл]инский", "Огромный. <i>Над нами возвышались исполинские сосны.</i>", "Исполин — великан."],
 ["пр[и|!е]бывать", "Находиться где-либо. <i>Он пребывал в хорошем настроении.</i>", "Пре- = «быть долго». Не путать с «прибывать» — приезжать."],
 ["д[и|!е]в[е|!я]ност[!о|а]", "Число 90. <i>Бабушке девяносто лет.</i>", "Девять — девяносто: на конце О."],
 ["э[!в|ф]к[о|!а]липт", "Южное вечнозелёное дерево. <i>Коалы едят листья эвкалипта.</i>", "Эв- + калипт."],
 ["пр[!и|е]к[!а|о]зать", "Дать распоряжение. <i>Командир приказал отступить.</i>", "При- + каз (указ)."],
 ["а[к|!кк]уратный", "Опрятный, старательный. <i>Он аккуратный ученик.</i>", "Запомни: аККуратный."],
 ["пр[и|!е][а|!о]д[!о|а]леть", "Справиться с трудностью. <i>Мы преодолели препятствие.</i>", "Пре- = «пере-»: переодолеть; одолеть."],
 ["в[!е|и]ст[е|!и]бюль", "Входной зал в здании. <i>Встретимся в вестибюле.</i>", "Вест- + -и- + -бюль."],
 ["син[!и|е]й", "Цвет ясного неба. <i>Синий платок.</i>", "Синева."],
 ["р[!е|и]форма", "Преобразование, переустройство. <i>Провели реформу образования.</i>", "Ре- + форма."],
 ["[а|!о]б[!и|е]хо[!д|т]", "Повседневная жизнь, быт. <i>Слово вошло в обиход.</i>", "Обходиться — обиход."],
 ["пр[и|!е]кр[!а|о]тить", "Перестать делать. <i>Дождь прекратился.</i>", "Пре- = «пере-»: перекратить."],
 ["п[!а|о]л[е|!и]садник", "Садик перед домом за оградой. <i>В палисаднике цветут георгины.</i>", "Палисад — изгородь; Д на конце корня."],
 ["ю[!н|нн]ый", "Очень молодой. <i>Юный художник.</i>", "Одна Н: юный (исключение)."],
 ["[о|!а]рм[!а|о]тура", "Металлический каркас в бетоне. <i>Строители укладывают арматуру.</i>", "Армировать — арматура."],
 ["до[сч|!щ][!а|я]тый", "Сделанный из досок. <i>Дощатый пол скрипел.</i>", "Доска — дощатый: Щ, суффикс -ат-."],
 ["оди[н|!нн]а[ц|!дц]ать", "Число 11. <i>В классе одиннадцать мальчиков.</i>", "Один + на + дцать: две Н."],
 ["салфе[!т|д]ка", "Небольшой кусок ткани или бумаги для рук. <i>Возьми салфетку.</i>", "Проверка: салфе́ток."],
 ["т[и|!е][лл|!л][!е|и]гра[м|!мм]а", "Срочное сообщение по телеграфу. <i>Пришла телеграмма.</i>", "Теле- + граММа."],
 ["исс[е|!и]ня[_|+|!-]чёрный", "Чёрный с синим отливом. <i>У неё иссиня-чёрные волосы.</i>", "Оттенок цвета — через дефис."],
 ["тр[!о|а][л|!лл]ейбус", "Электрический автобус на проводах. <i>Мы ехали на троллейбусе.</i>", "Трол + лейбус: две Л."],

 ["ни[_|!+|-]как", "Никаким образом. <i>Я никак не мог уснуть.</i>", "Отрицательное наречие без предлога — слитно."],
 ["с[!и|е]туация", "Положение, обстановка. <i>Ситуация изменилась к лучшему.</i>", "Словарное слово: И после С."],
 ["р[!е|и]з[!и|е]денция", "Место пребывания главы государства. <i>Президент прибыл в резиденцию.</i>", "Резидент — то же написание."],
 ["п[!о|а]р[!а|о]жение", "Неудача в борьбе, проигрыш. <i>Команда потерпела поражение.</i>", "Однокоренные: поразить, разить."],
 ["н[!е|и]жда[н|!нн]ый", "Неожиданный. <i>Нежданный гость постучал вечером.</i>", "Исключение: нежданный, негаданный, нечаянный — НН."],
 ["за[!_|+|-]границу", "Куда? — в другую страну. <i>Летом мы поедем за границу.</i>", "Существительное с предлогом — раздельно (а «заграница» — существительное, слитно)."],
 ["с[!_|+|-]ра[!з|с]бегу", "Разбежавшись. <i>Он прыгнул в воду с разбегу.</i>", "Предлог С + слово «разбег»; приставка раз- перед звонкой Б."],
 ["св[!я|и]ще[н|!нн]ый", "Почитаемый как святыня; очень дорогой. <i>Защита Родины — священный долг.</i>", "Проверка: святой. Исключение: -енн- в прилагательном."],
 ["волей[_|+|!-]неволей", "Хочешь не хочешь. <i>Волей-неволей пришлось согласиться.</i>", "Сочетание слова с тем же словом с не- — через дефис."],
 ["р[!е|и]альный", "Действительный, выполнимый. <i>Это вполне реальный план.</i>", "Реальность, реалист — с Е."],
 ["[!о|а]ри[!е|и]нтация", "Умение определить своё положение. <i>Компас помогает в ориентации на местности.</i>", "Ориентир — Е после И."],
 ["за[_|!+|-]то", "Союз «но, однако». <i>Дорога длинная, зато красивая.</i>", "Можно заменить на «но» — слитно. «За то» (за что?) — раздельно."],
 ["[!э|и]п[!и|е]демия", "Массовое распространение болезни. <i>В городе началась эпидемия гриппа.</i>", "Греческое «эпи» — «над, среди» (эпизод, эпилог)."],
 ["под[!_|+|-]силу", "Можно сделать, хватит сил. <i>Эта задача тебе под силу.</i>", "Существительное с предлогом — раздельно."],
 ["по[!_|+|-]трое", "Группами по три человека. <i>Ученики шли по трое.</i>", "Предлог с собирательным числительным — раздельно."],
 ["с[!_|+|-]на[_|!+|-]лёту", "С ходу, сразу. <i>Он решил задачу с налёту.</i>", "Предлог С раздельно; «налёт» — одно слово."],
 ["акв[!а|о]лан[!г|х]", "Аппарат для дыхания под водой. <i>Дайвер надел акваланг.</i>", "Аква — «вода»; на конце Г."],
 ["бок[!_|+|-]о[!_|+|-]бок", "Рядом, вплотную. <i>Друзья шли бок о бок.</i>", "Три слова — раздельно."],
 ["за[_|!+|-]тем что[_|!+|-]бы", "Союз «для того чтобы». <i>Он пришёл затем, чтобы извиниться.</i>", "Союз «затем чтобы» = «для того чтобы»: «затем» и «чтобы» — слитно."],
 ["благ[!о|а]даря т[!о|а]му что", "Союз, указывающий на причину. <i>Благодаря тому что мы вышли рано, мы успели на поезд.</i>", "Благо + дарить — с О; «тому» — от слова «тот»."],
 ["давным[_|+|!-]давно", "Очень давно. <i>Давным-давно жил на свете король.</i>", "Повтор одной основы — через дефис."],
 ["на[!_|+|-]дом", "Задание на дом — для выполнения дома. <i>Учитель задал на дом упражнение.</i>", "Существительное с предлогом — раздельно."],
 ["г[!и|е]мнастика", "Физические упражнения. <i>Утром мы делаем гимнастику.</i>", "Гимнаст, гимназия — с И."],
 ["по[!_|+|-]сов[!е|и]сти", "Честно, справедливо. <i>Поступи по совести.</i>", "Существительное с предлогом — раздельно; совесть — с Е."],
 ["к[!о|а][мм|!м][!е|и]ндант", "Начальник здания или крепости. <i>Ключи выдаёт комендант общежития.</i>", "Запомни: одна М и Е — комЕндант."],
 ["н[!и|е]чуть", "Нисколько. <i>Он ничуть не устал.</i>", "Отрицательное наречие, НИ без ударения — слитно."],
 ["из[_|+|!-]за", "Составной предлог. <i>Из-за дождя матч перенесли.</i>", "Предлоги из-за и из-под — через дефис."],
 ["ни[_|!+|-]мало", "Нисколько, ничуть. <i>Он нимало не смутился.</i>", "Нимало = нисколько — слитно. «Не мало» = много — другое значение."],
 ["ж[!е|и]ла[н|!нн]ый", "Такой, которого ждут с радостью. <i>Ты у нас желанный гость.</i>", "Исключение: желанный — НН. Проверка: жела́ть."],
 ["ни[_|!+|-]скол[!е|и]чко", "Совсем нисколько (разг.). <i>Мне нисколечко не страшно.</i>", "Как «нисколько» — слитно; суффикс -ечк-."],
 ["н[!е|и]слыха[н|!нн]ый", "Небывалый. <i>Это неслыханная дерзость!</i>", "Исключение: неслыханный, невиданный — НН."],
 ["кла[с|!сс]ик", "Выдающийся писатель или художник. <i>Пушкин — классик русской литературы.</i>", "Класс — две С."],
 ["ни[!_|+|-]разу", "Ни одного раза. <i>Я ни разу не был в Москве.</i>", "Частица НИ и существительное — раздельно."],
 ["точь[_|+|!-]в[_|+|!-]точь", "Совершенно так же. <i>Сын точь-в-точь похож на отца.</i>", "Повтор слова с предлогом — через дефис."],
 ["[!а|о]рти[л|!лл]ерия", "Войска с пушками; орудия. <i>Загрохотала артиллерия.</i>", "Запомни: Арти + ЛЛ."],
 ["св[!е|и]т[!о|а]фор", "Сигнальное устройство на дороге. <i>Перейди улицу на зелёный сигнал светофора.</i>", "Свет + соединительная О + -фор."],
 ["за[!_|+|-]границей", "Где? — в другой стране. <i>Он долго жил за границей.</i>", "Существительное с предлогом — раздельно."],
 ["[!о|а]р[!и|е][!е|и]нтирова[!ться|тся]", "Определять своё положение. <i>Он хорошо ориентируется в лесу.</i>", "Ориентир. Что делать? — ориентироваться: -ТЬСЯ."],
 ["[!о|а]тразить", "Показать, воспроизвести; отбить. <i>Вода отразила облака.</i>", "Приставка от-; корень -раз- (разить)."],
 ["по[!_|+|-]двое", "Группами по два. <i>Дети стояли по двое.</i>", "Предлог с собирательным числительным — раздельно."],
 ["с[!и|е]ять", "Ярко светиться. <i>Её глаза сияли от счастья.</i>", "Словарное слово: сиять, сияние."],
 ["г[!и|е]рлянда", "Цепочка из цветов, лампочек, флажков. <i>На ёлке горит гирлянда.</i>", "Словарное слово: И после Г."],
 ["а[!в|ф]т[!о|а]р", "Создатель произведения. <i>Кто автор этого стихотворения?</i>", "Авторский — В и О."],
 ["на[!_|+|-]глазок", "Приблизительно, без измерения. <i>Муку отмерили на глазок.</i>", "Существительное с предлогом — раздельно."],
 ["кова[!н|нн]ый", "Сделанный ковкой. <i>У ворот стояла кованая ограда.</i>", "-ов- здесь часть корня (ковать), а не суффикс -ова-; без приставки — Н, как в «жёваный»."],
 ["снаря[!д|т]", "Спортивное устройство; боевой заряд. <i>Гимнаст подошёл к снаряду.</i>", "Проверка: снаря́ды, снарядить."],
 ["в[!_|+|-]силу того что", "Союз «потому что». <i>В силу того что шёл дождь, игру отменили.</i>", "Составной союз — все части раздельно."],
 ["на[!_|+|-]сов[!е|и]сть", "Добросовестно, хорошо. <i>Работа сделана на совесть.</i>", "Существительное с предлогом — раздельно."],
 ["не[_|!+|-]вида[н|!нн]ый", "Небывалый, удивительный. <i>Урожай был невиданный.</i>", "Исключение: невиданный — НН."],
 ["гал[!е|и]рея", "Длинный крытый коридор; картинная галерея. <i>Мы побывали в Третьяковской галерее.</i>", "Запомни: одна Л и Е."],
 ["к[!а|о]ли[!т|д]ка", "Небольшая дверь в заборе. <i>Скрипнула калитка.</i>", "Словарное слово: кАлиТка."],
 ["п[!о|а]чта[!льо|льйо]н", "Разносчик почты. <i>Почтальон принёс письмо.</i>", "Почта; после Л перед О — ЛЬО (бульон, медальон)."],
 ["чемп[!и|е]оны", "Победители соревнований. <i>Чемпионы получили медали.</i>", "Как в слове «чемпион»."],
 ["с[!е|и]м[!а|о]фор", "Сигнальный столб на железной дороге. <i>Семафор открыл путь поезду.</i>", "Как «светофор» — с окончанием -фор; сем- с Е."],
 ["старат[!е|и]льно", "Усердно, прилежно. <i>Он старательно выводил буквы.</i>", "Суффикс -тельн- всегда с Е."],
 ["ка[!р|рр][!и|е]катура", "Смешной рисунок, преувеличивающий черты. <i>В газете напечатали карикатуру.</i>", "Одна Р и И: карикатура, карикатурный."],
 ["[!о|а]санка", "Манера держать спину. <i>У балерины прекрасная осанка.</i>", "Словарное слово: О в начале."],
 ["в[!о|а]зражен[!и|е]е", "Ответ несогласия. <i>Возражения не принимаются.</i>", "Приставка воз-; -ение (как в «решение»)."],
 ["на[!_|+|-]ми[!г|к]", "Ненадолго. <i>Он задумался на миг.</i>", "Существительное с предлогом — раздельно. Проверка: ми́ги, мига́ть."],
 ["на[!_|+|-]ск[!а|о]ку", "Во время скачки. <i>Всадник рубил на скаку.</i>", "Существительное с предлогом — раздельно. Проверка: ска́чка."],
 ["с[!_|+|-]тем что[_|!+|-]бы", "Союз цели. <i>Он вернулся с тем чтобы попрощаться.</i>", "Составной союз — раздельно, «чтобы» — слитно."],
 ["для[!_|+|-]того что[_|!+|-]бы", "Союз цели. <i>Для того чтобы успеть, мы взяли такси.</i>", "Составной союз — раздельно, «чтобы» — слитно."],
 ["к[!о|а]мби[!н|нн]ат", "Объединение нескольких предприятий. <i>Отец работает на комбинате.</i>", "Одна Н: комбинат."],
 ["на[!_|+|-]днях", "Недавно или скоро. <i>Мы встретились на днях.</i>", "Существительное с предлогом — раздельно."],
 ["по[!_|+|-]прибыти[!и|е]", "После прибытия. <i>По прибытии поезда начнётся посадка.</i>", "Предлог «по» = «после» — на конце -и."],
 ["что[_|!+|-]бы", "Союз цели. <i>Я пришёл, чтобы помочь.</i>", "Союз (= для того чтобы) — слитно. «Что бы» — местоимение с частицей: что бы ни случилось."],
 ["как[!_|+|-]будто", "Союз сравнения. <i>Он смотрел так, как будто узнал меня.</i>", "Союз «как будто» — раздельно."],
 ["на[!_|+|-]ходу", "Во время движения. <i>Он вскочил в трамвай на ходу.</i>", "Существительное с предлогом — раздельно."],
 ["от[_|!+|-]того что", "Союз «потому что». <i>Он улыбался оттого, что был счастлив.</i>", "Союз «оттого что» = «потому что» — слитно. «От того дома» (от какого?) — раздельно."],
 ["не[!_|+|-]раз", "Много раз. <i>Я не раз бывал здесь.</i>", "Не раз = часто — раздельно. Ни разу = никогда."],
 ["к[!о|а]ло[н|!нн]а", "Столб у здания; строй людей. <i>Здание украшено колоннами.</i>", "Запомни: колоННа."],
 ["кр[!о|а]мешный", "Полный, непроглядный. <i>Вокруг была кромешная тьма.</i>", "Словарное слово: кромешный."],
 ["ож[!е|и]релье", "Украшение на шею. <i>На ней было жемчужное ожерелье.</i>", "Запомни: ожЕрелье."],
 ["аквар[!и|е]ум", "Сосуд для рыб. <i>В аквариуме плавают рыбки.</i>", "Аква — «вода»; -иум."],
 ["в[_|!+|-]ми[!г|к]", "Мгновенно. <i>Мальчик вмиг оделся.</i>", "Наречие = «мгновенно» — слитно."],
 ["в[_|!+|-]следстви[!е|и] того что", "Союз «потому что». <i>Вследствие того что лёд растаял, каток закрыли.</i>", "Производный предлог «вследствие» — слитно, на конце Е; «того что» — раздельно."],
 ["сати[!р|рр]а", "Высмеивание пороков. <i>Комедия полна острой сатиры.</i>", "Одна Р: сатира, сатирик."],
 ["кро[с|!сс]", "Бег по пересечённой местности. <i>Мы бежали кросс по лесу.</i>", "Английское cross — две С."],
 ["к[!о|а]мб[!и|е][!н|нн]ация", "Сочетание; продуманный ход. <i>Футболисты разыграли комбинацию.</i>", "Комбинировать — та же основа."]
],
8: [

 ["вид[и|!е]окам[и|!е]ра", "Камера для съёмки видео. <i>Включи видеокамеру.</i>", "Видео- пишется слитно."],
 ["р[и|!е]п[и|!е]тиция", "Подготовка выступления. <i>Репетиция концерта.</i>", "Репетировать."],

 ["ма[с|!сс]ив", "Большое пространство чего-то однородного. <i>Лесной массив.</i>", "Масса: две С."],

function advanceGap() {
  $("opts").style.pointerEvents = "";
  gapIdx = cur.w.parts.findIndex((p, k) => p.g && !cur.state[k]);
  if (gapIdx < 0) return finishCard();
  drawWord(); drawOpts();
}
function finishCard() {
  done = true; drawWord(); drawOpts();
  if (!cur.retry) seenMain++;
  if (hadErr) {
    $("msg").textContent = "Есть ошибка — слово ещё вернётся"; $("msg").className = "msg bad";
    if (!errWords.includes(cur.w)) errWords.push(cur.w);
    if (!cur.retry) queue.push({ w: cur.w, retry: true });
  } else {
    $("msg").textContent = "Всё правильно!"; $("msg").className = "msg good";
    if (!cur.retry) firstTry++;
  }
  $("meaning").innerHTML = cur.w.mean; $("meaning").classList.remove("hidden");
  $("nextRow").classList.remove("hidden"); $("next").focus();
}
$("next").onclick = () => { pos++; nextCard(); };
$("help").onclick = () => {
  const open = $("tip").classList.toggle("hidden") === false;
  $("help").setAttribute("aria-expanded", open);
};
document.addEventListener("click", e => { if (!e.target.closest(".help") && !e.target.closest(".tip")) { $("tip").classList.add("hidden"); $("help").setAttribute("aria-expanded", "false"); } });
$("stop").onclick = finish;
document.addEventListener("keydown", e => {
  if ($("scrCard").classList.contains("hidden")) return;
  if (e.key === "Enter" && done) { e.preventDefault(); pos++; nextCard(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && !done) { const b = $("opts").querySelectorAll(".opt")[n - 1]; if (b) choose(b); }
});

/* ---------- итог ---------- */
function finish() {
  const base = seenMain;
  $("score").textContent = `${firstTry} из ${base}`;
  $("finText").textContent = base ? `${plural(firstTry, "слово написано", "слова написаны", "слов написано")} верно с первой попытки` : "Ни одного слова не пройдено";
  $("errs").innerHTML = errWords.length ? errWords.map(w => `<span>${w.word}</span>`).join("") : (base ? "<span style='background:var(--green-bg);border-color:#bfe0c5;color:var(--green)'>Без ошибок!</span>" : "");
  $("fErr").classList.toggle("hidden", !errWords.length);
  show("scrFin");
}
$("fErr").onclick = () => { lastSet = shuffle(errWords); start(lastSet); };
$("fAgain").onclick = () => start(shuffle(lastSet));
$("fMenu").onclick = () => show("scrStart");

renderGrades(); loadGrade();
</script>
</body>
</html>
