<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карточки: О и Е после шипящих в наречиях</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8; --surface: #fffdf8; --border: #ddd6c4; --text: #2a2118;
      --muted: #7a6e5f; --hint: #b0a48c; --green: #3a7d44; --green-bg: #eaf4ec;
      --red: #c0392b; --red-bg: #fdf0ee; --accent: #5b4fcf; --accent-bg: #efedfa;
      --shadow: 0 4px 24px rgba(60,40,10,0.10);
      --serif: 'Merriweather', Georgia, 'Times New Roman', serif;
      --sans: 'Nunito', 'Segoe UI', Arial, sans-serif;
    }
    body {
      background: var(--bg); font-family: var(--sans); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem 4rem;
    }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 1.5rem; }
    .progress-bar { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.4s ease; width: 0%; }
    .card-wrap { width: 100%; max-width: 560px; }
    .card, .finish-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 2.5rem 2rem 2rem; text-align: center; box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: center;
    }
    .top-msg { font-size: 1.1rem; font-weight: 700; min-height: 30px; margin-bottom: 0.6rem; opacity: 0; transition: opacity 0.3s; letter-spacing: 0.5px; }
    .top-msg.show { opacity: 1; }
    .top-msg.good { color: var(--green); }
    .top-msg.remind { color: var(--muted); }
    .mode-badge {
      display: inline-block; font-size: 0.75rem; font-weight: 600; color: var(--red);
      background: var(--red-bg); border: 1px solid #f0c4be; border-radius: 99px;
      padding: 3px 14px; margin-bottom: 0.8rem;
    }
    .counter { font-size: 0.78rem; color: var(--hint); margin-bottom: 1.2rem; font-weight: 600; letter-spacing: 1px; }
    .word-display {
      font-family: var(--serif); font-size: 1.6rem; font-weight: 400; margin-bottom: 1.8rem;
      line-height: 1.5; word-break: break-word;
    }
    .q { font-weight: 700; color: var(--red); }
    .q.correct { color: var(--green); }
    .q.reveal { color: var(--red); }
    .choices { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 1.6rem; }
    .choice-btn {
      font-family: var(--serif); font-size: 1.2rem; font-weight: 700;
      min-width: 150px; padding: 14px 20px; border-radius: 14px;
      border: 2px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .choice-btn small { font-family: var(--sans); font-size: 0.72rem; font-weight: 600; color: var(--hint); }
    .choice-btn:hover:not(:disabled) { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); box-shadow: 0 2px 12px rgba(91,79,207,0.13); }
    .choice-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .choice-btn:active:not(:disabled) { transform: scale(0.96); }
    .choice-btn.wrong-flash { background: var(--red-bg); border-color: var(--red); color: var(--red); animation: shake 0.35s; }
    .choice-btn.right { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    .explanation { font-size: 0.92rem; color: var(--muted); line-height: 1.8; max-width: 440px; opacity: 0; transition: opacity 0.4s; min-height: 60px; }
    .explanation.show { opacity: 1; }
    .explanation b { color: var(--text); font-weight: 700; }
    .explanation i { color: var(--hint); }
    .nav-row { display: flex; justify-content: center; margin-top: 1.4rem; }
    .nav-btn, .btn-restart, .btn-errors, .btn-start {
      padding: 11px 26px; border-radius: 99px; border: 2px solid var(--border); background: var(--surface);
      color: var(--text); font-family: var(--sans); font-size: 0.9rem; font-weight: 700; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn:hover, .btn-restart:hover, .btn-start:hover { background: var(--bg); border-color: var(--muted); }
    .btn-start.primary { border-color: var(--accent); color: var(--accent); }
    .btn-start.primary:hover { background: var(--accent-bg); }
    .btn-errors { border-color: var(--red); color: var(--red); background: transparent; }
    .btn-errors:hover { background: var(--red-bg); }
    .finish-icon { font-size: 2.8rem; margin-bottom: 0.6rem; }
    .finish-title { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; color: var(--green); margin-bottom: 0.4rem; }
    .finish-sub { font-size: 0.95rem; color: var(--muted); margin-bottom: 1.6rem; line-height: 1.6; }
    .mistakes-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: 0.8rem; }
    .mistake-item { font-family: var(--serif); font-size: 1.02rem; color: var(--text); margin: 7px 0; }
    .mistake-item span { color: var(--red); font-weight: 700; }
    .all-correct { font-size: 0.95rem; color: var(--green); font-weight: 700; margin-bottom: 0.6rem; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 1.8rem; }
    .kbd-hint { font-size: 0.75rem; color: var(--hint); margin-top: 1rem; }
    @media (max-width: 480px) {
      header h1 { font-size: 1.2rem; }
      .word-display { font-size: 1.3rem; }
      .choice-btn { min-width: 0; width: 100%; font-size: 1.1rem; }
      .card, .finish-card { padding: 2rem 1.2rem 1.5rem; }
      .kbd-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    .home-link { position: absolute; top: 1rem; left: 1rem; font-size: 0.85rem; font-weight: 700; color: var(--muted); text-decoration: none; padding: 6px 14px; border: 2px solid var(--border); border-radius: 99px; background: var(--surface); }
    .home-link:hover { color: var(--accent); border-color: var(--accent); }
    body { position: relative; }
    @media (max-width: 480px) { .home-link { position: static; align-self: flex-start; margin-bottom: 1rem; } }
  </style>
</head>
<body>

<a class="home-link" href="index.html">← На главную</a>

<header>
  <h1>О и Е после шипящих на конце наречий</h1>
  <p>Горячо или певуче?</p>
</header>

<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="prog"></div></div></div>
<div class="card-wrap"><div id="main"></div></div>

<script>
// [контекст с #, вопрос, правильно, неправильно, тип (s — слитно, r — раздельно, d — через дефис), пояснение]
const RAW = [
  ["солнце пекло #", "горяч_", "горячо", "горяче", "o", "Ударение на конце: <i>горячО</i> → под ударением пишется <b>О</b>."],
  ["спорили #", "горяч_", "горячо", "горяче", "o", "Ударение на конце: <i>горячО</i> → под ударением пишется <b>О</b>."],
  ["на улице стало #", "свеж_", "свежо", "свеже", "o", "Ударение на конце: <i>свежО</i> → под ударением пишется <b>О</b>."],
  ["пахнет # и чисто", "свеж_", "свежо", "свеже", "o", "Ударение на конце: <i>свежО</i> → под ударением пишется <b>О</b>."],
  ["всё будет #!", "хорош_", "хорошо", "хороше", "o", "Ударение на конце: <i>хорошО</i> → под ударением пишется <b>О</b>."],
  ["он # поёт", "хорош_", "хорошо", "хороше", "o", "Ударение на конце: <i>хорошО</i> → под ударением пишется <b>О</b>."],
  ["ответил слишком #", "общ_", "общо", "обще", "o", "Ударение на конце: <i>общО</i> → под ударением пишется <b>О</b>."],
  ["птица пела #", "певуч_", "певуче", "певучо", "e", "Ударение падает раньше: <i>певУче</i> → конец без ударения, пишется <b>Е</b>."],
  ["крапива жалит #", "жгуч_", "жгуче", "жгучо", "e", "Ударение падает раньше: <i>жгУче</i> → конец без ударения, пишется <b>Е</b>."],
  ["медвежонок двигался #", "неуклюж_", "неуклюже", "неуклюжо", "e", "Ударение падает раньше: <i>неуклЮже</i> → конец без ударения, пишется <b>Е</b>."],
  ["дуб стоял #", "могуч_", "могуче", "могучо", "e", "Ударение падает раньше: <i>могУче</i> → конец без ударения, пишется <b>Е</b>."],
  ["он посмотрел #", "вызывающ_", "вызывающе", "вызывающо", "e", "Ударение падает раньше: <i>вызывАюще</i> → конец без ударения, пишется <b>Е</b>."],
  ["голос звучал #", "тягуч_", "тягуче", "тягучо", "e", "Ударение падает раньше: <i>тягУче</i> → конец без ударения, пишется <b>Е</b>."],
  ["ответ прозвучал #", "блестящ_", "блестяще", "блестящо", "e", "Ударение падает раньше: <i>блестЯще</i> → конец без ударения, пишется <b>Е</b>."],
  ["ветер выл #", "зловещ_", "зловеще", "зловещо", "e", "Ударение падает раньше: <i>зловЕще</i> → конец без ударения, пишется <b>Е</b>."],
  ["собака рычала #", "угрожающ_", "угрожающе", "угрожающо", "e", "Ударение падает раньше: <i>угрожАюще</i> → конец без ударения, пишется <b>Е</b>."],
  ["мама улыбнулась #", "ободряющ_", "ободряюще", "ободряющо", "e", "Ударение падает раньше: <i>ободрЯюще</i> → конец без ударения, пишется <b>Е</b>."],
  ["щетина кололась #", "колюч_", "колюче", "колючо", "e", "Ударение падает раньше: <i>колЮче</i> → конец без ударения, пишется <b>Е</b>."],
  ["он посмотрел на меня #", "умоляющ_", "умоляюще", "умоляющо", "e", "Ударение падает раньше: <i>умолЯюще</i> → конец без ударения, пишется <b>Е</b>."],
  ["расскажи # раз", "ещ_", "ещё", "ещо", "yo", "Запомни исключение: <b>ещё</b> — под ударением, но пишется <b>Ё</b>, а не О."]
];

const TYPE = { o: "буква О", e: "буква Е", yo: "буква Ё" };
const SOURCE = RAW.map(([ctx, q, correct, wrong, t, expl]) => ({ ctx, q, correct, wrong, t, expl }));

function typeOf(str) {
  if (str.includes("-")) return "через дефис";
  return null;
}
function labelFor(w, variant) {
  const ch = variant[w.q.indexOf('_')] || '';
  return 'буква ' + ch.toUpperCase();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let deck = [], idx = 0, mistakes = [], answered = false, hadMistake = false, isErrorMode = false, choices = [], deckSize = 0;

function sentence(w, mode) {
  let inner;
  if (mode === 'blank') inner = `<span class="q">${w.q}</span>`;
  else inner = `<span class="q ${mode}">${w.correct}</span>`;
  let s = w.ctx.replace('#', inner);
  return s.charAt(0) === '<' ? s : s;
}

function startScreen() {
  document.getElementById('prog').style.width = '0%';
  document.getElementById('main').innerHTML = `
    <div class="finish-card">
      <div class="finish-icon">✍️</div>
      <div class="finish-title" style="color:var(--text)">Выбери тренировку</div>
      <div class="finish-sub">Всего в наборе ${SOURCE.length} карточек.<br>Выбери, какая буква пропущена.<br><b>Подсказка:</b> произнеси слово и найди ударение. Ударение на конце — <b>О</b> (<i>горячО</i>), ударение раньше — <b>Е</b> (<i>певУче</i>). Исключение: <b>ещё</b>.</div>
      <div class="btn-row" style="margin-top:0.4rem">
        <button class="btn-start primary" onclick="begin(10)">10 случайных</button>
                <button class="btn-start" onclick="begin(0)">Все ${SOURCE.length}</button>
      </div>
    </div>`;
}

function begin(n) {
  deckSize = n;
  const all = shuffle(SOURCE);
  deck = n ? all.slice(0, n) : all;
  roundSet = [...deck];
  idx = 0; mistakes = []; isErrorMode = false;
  render();
}

function render() {
  if (idx >= deck.length) { showFinish(); return; }
  const w = deck[idx];
  hadMistake = false; answered = false;
  document.getElementById('prog').style.width = (idx / deck.length * 100) + '%';
  choices = Math.random() > 0.5 ? [w.correct, w.wrong] : [w.wrong, w.correct];
  const badge = isErrorMode ? '<div class="mode-badge">Работа над ошибками</div>' : '';
  document.getElementById('main').innerHTML = `
    <div class="card">
      <div class="top-msg" id="topmsg"></div>
      ${badge}
      <div class="counter">${idx + 1} / ${deck.length}</div>
      <div class="word-display" id="wdisp">${sentence(w, 'blank')}</div>
      <div class="choices">
        ${choices.map((ch, i) => `<button class="choice-btn" data-i="${i}" onclick="choose(${i})">${ch}<small>${labelFor(w, ch)}</small></button>`).join('')}
      </div>
      <div class="explanation" id="expl">${w.expl}</div>
    </div>
    <div class="nav-row" id="nav" style="display:none">
      <button class="nav-btn" id="nextBtn" onclick="next()">Следующее →</button>
    </div>
    <div class="kbd-hint" style="text-align:center">Клавиши: 1 / 2 — выбор, Enter — дальше</div>`;
}

function choose(i) {
  if (answered) return;
  const w = deck[idx];
  const ch = choices[i];
  const btns = document.querySelectorAll('.choice-btn');
  const btn = btns[i];
  if (ch === w.correct) {
    answered = true;
    btns.forEach(b => b.disabled = true);
    btn.classList.add('right');
    const topMsg = document.getElementById('topmsg');
    document.getElementById('wdisp').innerHTML = sentence(w, hadMistake ? 'reveal' : 'correct');
    document.getElementById('expl').classList.add('show');
    document.getElementById('nav').style.display = 'flex';
    document.getElementById('nextBtn').focus();
    if (hadMistake) {
      topMsg.textContent = 'Запомни!'; topMsg.className = 'top-msg remind show';
      if (!mistakes.includes(w)) mistakes.push(w);
    } else {
      topMsg.textContent = 'МОЛОДЕЦ!'; topMsg.className = 'top-msg good show';
    }
  } else {
    hadMistake = true;
    btn.classList.add('wrong-flash'); btn.disabled = true;
    setTimeout(() => { btn.classList.remove('wrong-flash'); btn.disabled = false; }, 500);
  }
}

function next() { idx++; render(); }

document.addEventListener('keydown', e => {
  if (!deck.length || idx >= deck.length) return;
  if (!answered && (e.key === '1' || e.key === '2')) choose(Number(e.key) - 1);
  else if (answered && e.key === 'Enter') { e.preventDefault(); next(); }
});

function showFinish() {
  document.getElementById('prog').style.width = '100%';
  const total = deck.length, correct = total - mistakes.length;
  const mistakesHTML = mistakes.length
    ? `<div class="mistakes-title">Сочетания с ошибками</div>` +
      mistakes.map(w => `<div class="mistake-item">${w.ctx.replace('#', `<span>${w.correct}</span>`)}</div>`).join('')
    : `<div class="all-correct">Всё написано без ошибок! 🎉</div>`;
  const errBtn = mistakes.length ? `<button class="btn-errors" onclick="startErrorMode()">Работа над ошибками</button>` : '';
  document.getElementById('main').innerHTML = `
    <div class="finish-card">
      <div class="finish-icon">${mistakes.length === 0 ? '🏆' : '📝'}</div>
      <div class="finish-title">${isErrorMode ? 'Работа над ошибками завершена!' : 'Тренировка завершена!'}</div>
      <div class="finish-sub">Верно с первого раза: ${correct} из ${total}</div>
      ${mistakesHTML}
      <div class="btn-row">
        <button class="btn-restart" onclick="repeatRound()">Повторить эти же слова</button>
        <button class="btn-restart" onclick="startScreen()">Начать заново</button>
        <a class="btn-restart" href="index.html" style="text-decoration:none">На главную</a>
        ${errBtn}
      </div>
    </div>`;
}

let roundSet = [];
function repeatRound() {
  deck = shuffle(roundSet);
  idx = 0; mistakes = [];
  render();
}

function startErrorMode() {
  const errs = [...mistakes];
  mistakes = []; deck = shuffle(errs); roundSet = [...deck]; idx = 0; isErrorMode = true;
  render();
}

startScreen();
</script>
</body>
</html>
